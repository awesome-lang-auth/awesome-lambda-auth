AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# awesome-lambda-auth — quickstart stack
# =====================================
#
# One HTTP API (payload format 2.0), one Lambda running the whole auth router,
# one DynamoDB single table, one generated signing secret holding both HS256
# keys. Nothing else.
#
# ---------------------------------------------------------------------------
# KNOWN LIMITATION: cookie mode needs a custom domain
# ---------------------------------------------------------------------------
# On a raw execute-api URL the service cannot issue hardened cookies, and the
# runtime will REFUSE TO START in cookie mode unless you say so explicitly.
# Two separate problems, both real:
#
#   1. The stage path is not "/". A named stage serves the API at
#      https://<id>.execute-api.<region>.amazonaws.com/<stage>/..., so the
#      browser sees a stage segment the router does not. The `__Host-` prefix
#      requires Path=/ and no Domain, and the Path-scoped refresh cookie
#      (cookies.refreshTokenPath, derived as <apiPrefix>/refresh) no longer
#      matches the URL the browser actually requests. See the note on
#      lambdahttp.Options.StagePrefix in internal/lambdahttp/lambdahttp.go:85-94:
#      stripping the stage server-side fixes routing and does nothing for the
#      browser. This template defaults StageName to "$default", which serves at
#      the domain root and removes this half of the problem; a named stage
#      brings it back, and the template then compensates by prefixing
#      AWESOME_AUTH_COOKIES_REFRESH_PATH with the stage.
#
#   2. execute-api.amazonaws.com is a shared registrable domain. Every other
#      AWS account's API lives under it, so cookie scoping and the CSRF
#      double-submit no longer rest on a host you control. "$default" does not
#      fix this and nothing except a custom domain will.
#
# CloudFront changes the first half and not the second. Set EnableCloudFront
# to "true" and the stage segment moves onto the origin (AuthDistribution's
# OriginPath), so the browser sees paths rooted at "/" whatever StageName says —
# problem 1 is gone even on a named stage. Problem 2 is not: *.cloudfront.net is
# a shared registrable domain in exactly the way execute-api.amazonaws.com is.
# Only CloudFrontAliases plus CloudFrontCertificateArn — a domain you control —
# closes it, and that is the same conclusion as the paragraph below reaches.
#
# The governing knob is `cookies.allowInsecureCookieMode`
# (AWESOME_AUTH_COOKIES_ALLOW_INSECURE_COOKIE_MODE), spec config-schema.md
# §1.2, enforced by refuse-to-start rule RS-2 (§2, internal/config/rules.go
# checkRS2InsecureCookieMode). It defaults to "true" here so the quickstart
# boots; for anything real, set PublicUrl to a custom domain and flip it to
# "false". Bearer clients (X-Auth-Strategy: bearer) are unaffected either way.
# ---------------------------------------------------------------------------

Description: >-
  awesome-lambda-auth quickstart: HTTP API + one Lambda auth router + a
  DynamoDB single table. Self-hosted authentication in your own account.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Deployment}
        Parameters: [DeploymentEnvironment, StageName, PublicUrl, ApiPrefix]
      - Label: {default: Browser-facing behaviour}
        Parameters: [AllowedOrigins, CookieDomain, CookieSameSite, AllowInsecureCookieMode]
      - Label: {default: Signing secrets}
        Parameters: [JwtAccessSecretArn, JwtRefreshSecretArn]
      - Label: {default: Credential delivery}
        Parameters: [MailerFromAddress, MailerFromName, MailerIdentity, MailerDefaultLang, EnableSmsDelivery]
      - Label: {default: Email flows}
        Parameters: [EmailSiteUrls, EmailDeliveryWebhookUrl, EmailDeliveryWebhookSecretArn]
      - Label: {default: Second factor and token claims}
        Parameters: [TotpIssuer, ClaimsWebhookUrl, ClaimsWebhookTimeoutMs, ClaimsWebhookSecretArn]
      - Label: {default: OAuth providers}
        Parameters: [OAuthGoogleClientId, OAuthGoogleClientSecretArn, OAuthGithubClientId, OAuthGithubClientSecretArn]
      - Label: {default: Identity provider (OIDC)}
        Parameters: [EnableIdp, IdpIssuer, IdpKmsKeyId, IdpPreviousKmsKeyArns, IdpJwksPath]
      - Label: {default: Resource server}
        Parameters: [EnableResourceServer, ResourceServerJwksUrl, ResourceServerIssuer]
      - Label: {default: Migration from Amazon Cognito}
        Parameters: [CognitoUserPoolId, CognitoRegion, CognitoAppClientId, CognitoMigrationMode]
      - Label: {default: Configuration document}
        Parameters: [ConfigFile]
      - Label: {default: Storage}
        Parameters: [TableNamePrefix, MaxReadRequestUnits, MaxWriteRequestUnits, EnableDeletionProtection]
      - Label: {default: Function}
        Parameters: [MemorySize, Timeout, ReservedConcurrentExecutions, SessionCheckOn]
      - Label: {default: Content delivery (CloudFront)}
        Parameters: [EnableCloudFront, CloudFrontAliases, CloudFrontCertificateArn, CloudFrontPriceClass]
      - Label: {default: Admin console}
        Parameters: [EnableAdminConsole, AdminAccessPolicy, AdminRootEmail, AdminRootPasswordHashArn, EnableAdminUploads]
      - Label: {default: Observability and alarms}
        Parameters:
          - LogRetentionDays
          - EnableAlarms
          - AlarmEmail
          - AlarmTopicArn
          - DurationAlarmThresholdMs
          - ConcurrencyAlarmThreshold
          - CapacityAlarmUnits
          - LogIngestionAlarmBytes
      - Label: {default: Budget}
        Parameters: [BudgetLimitUsd, BudgetTimeUnit, EnableCostAnomalyDetection]

Parameters:

  DeploymentEnvironment:
    Type: String
    Default: development
    AllowedValues: [development, production]
    Description: >-
      AWESOME_AUTH_DEPLOYMENT_ENVIRONMENT. "production" turns on the strict
      refuse-to-start rules (config-schema.md §2). The quickstart defaults to
      development because it runs on a shared AWS domain.

  StageName:
    Type: String
    Default: '$default'
    AllowedPattern: '^(\$default|[A-Za-z0-9_-]{1,128})$'
    Description: >-
      HTTP API stage. "$default" serves at the domain root, which is what keeps
      cookie Path scoping working (see the header comment). A named stage adds
      a /<stage> segment to every URL.

  PublicUrl:
    Type: String
    Default: ''
    # An origin and nothing else: no path, no trailing slash. The OAuth callback
    # variables below are !Sub '${PublicUrl}${ApiPrefix}/oauth/<name>/callback',
    # and that value has to byte-match the URL registered with the provider —
    # "https://auth.example.com/" would produce a second slash and a redirect_uri
    # the provider rejects. Empty stays allowed; it is the default.
    AllowedPattern: '^$|^https?://[^/]+$'
    ConstraintDescription: >-
      PublicUrl must be a bare origin such as https://auth.example.com — scheme
      and host only, with no path and no trailing slash — or empty.
    Description: >-
      AWESOME_AUTH_DEPLOYMENT_PUBLIC_URL — the origin clients actually reach,
      e.g. https://auth.example.com. Empty leaves the variable unset, which is
      correct on a raw execute-api URL: the value's only consumer is RS-2, and
      RS-2 can only be satisfied on this stack's own domain by
      AllowInsecureCookieMode=true, which skips the check. See the note on the
      variable itself — defaulting it to the stack's own URL is a circular
      dependency. A custom domain here is the only way to run cookie mode with
      AllowInsecureCookieMode=false. Placeholder default is deliberately empty;
      never commit a real domain.

  ApiPrefix:
    Type: String
    Default: /auth
    # One or more non-empty segments, each beginning with a slash. The old
    # pattern admitted a bare "/" and a trailing slash, both of which put a
    # second slash into the derived OAuth callback URL — see PublicUrl.
    AllowedPattern: '^/[A-Za-z0-9._~-]+(/[A-Za-z0-9._~-]+)*$'
    ConstraintDescription: >-
      ApiPrefix must be one or more path segments, each introduced by a slash and
      none of them empty — e.g. /auth or /api/auth. A bare "/" and a trailing
      slash are both refused: they would double the slash in the derived OAuth
      callback URL.
    Description: AWESOME_AUTH_HTTP_API_PREFIX. Path the auth routes mount under.

  AllowedOrigins:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_CORS_ORIGINS — comma-separated absolute origins, e.g.
      https://app.example.com. Empty means no CORS middleware at all, which is
      correct for same-origin and bearer-only clients. CORS is handled by the
      function, not by API Gateway, so there is exactly one place it is
      configured.

  CookieDomain:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_COOKIES_DOMAIN. Empty means host-only cookies, which is the
      safer default; setting it forfeits the __Host- prefix. Placeholder is
      empty on purpose.

  CookieSameSite:
    Type: String
    Default: lax
    AllowedValues: [strict, lax, none]
    Description: AWESOME_AUTH_COOKIES_SAMESITE. "none" requires Secure, which this stack always sets.

  AllowInsecureCookieMode:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      AWESOME_AUTH_COOKIES_ALLOW_INSECURE_COOKIE_MODE. See the header comment.
      "true" is what lets a stack on a raw execute-api URL start at all. Set a
      custom domain in PublicUrl and change this to "false" before you put real
      users behind it.

  # -----------------------------------------------------------------------
  # Signing secrets: bring your own, or let the stack generate them.
  #
  # These parameters carry an ARN — a *reference*, never a value. Nothing about
  # a signing secret ever passes through a template parameter, a --parameter
  # override, a shell history or a CloudFormation event: leave them empty and
  # the stack generates the secrets with GenerateSecretString, which is the
  # default path and the one no human hand ever touches.
  #
  # Left empty, BOTH knobs end up pointing at the same generated secret with
  # different '#<jsonKey>' selectors, so cold start pays for one
  # GetSecretValue instead of two — see the JwtSigningSecrets resource.
  #
  # Deliberately NOT NoEcho. NoEcho is for values that must not be echoed, and
  # an ARN is the opposite: it is published in the function's environment on
  # purpose, so that `lambda:GetFunction` reveals a pointer instead of a key.
  # Marking it NoEcho would hide it from describe-stacks, where an operator
  # legitimately needs to read it, and would protect nothing.
  #
  # An ARN and not a name, because the same value is the IAM policy's Resource
  # and a bare name there is not a valid ARN. The pattern enforces it at
  # changeset time rather than letting the role creation fail halfway through.
  # -----------------------------------------------------------------------

  JwtAccessSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: >-
      ARN of an existing Secrets Manager secret holding the HS256 access-token
      signing secret. Empty (the default) generates one inside the stack. The
      function reads it at cold start; the value never enters the template.
      Append #<jsonKey> to select one key of a JSON secret document — point
      this and JwtRefreshSecretArn at the same ARN with two different keys and
      your stack gets the same one-fetch cold start the default path has.

  JwtRefreshSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: >-
      ARN of an existing Secrets Manager secret holding the refresh-token
      signing secret. Empty generates one. RS-1 requires it to differ from the
      access secret. Also accepts a #<jsonKey> selector.

  # -----------------------------------------------------------------------
  # Credential delivery — five routes mint something that has to be mailed or
  # texted, and this is where they get a transport.
  #
  # Mail goes through Amazon SES v2, text messages through an SNS publish
  # straight to the recipient's number. Neither has an endpoint or an API key:
  # both are called through the AWS API and authorised by the execution role's
  # policy below, which is why there is no MailerEndpoint parameter here even
  # though config-schema.md §1.5 lists `email.mailer.endpoint` as required.
  #
  # The binary reconciles that: it treats a `from` address as "a mailer is
  # configured", supplies the endpoint the schema insists on with a placeholder
  # of its own (below), and reports the endpoint and API key as knobs it cannot
  # honour in the cold-start log — see unwiredKnobs in cmd/auth/app.go. Nothing
  # is silently ignored and nothing has to be invented by the operator.
  #
  # LEAVE MailerFromAddress EMPTY and no mail is sent at all. That is not a
  # broken stack: POST /magic-link/send answers 500 EMAIL_NOT_CONFIGURED, and
  # /forgot-password, /send-verification-email and /change-email/request answer
  # 200 and mail nothing, which is exactly what the reference does with no email
  # block. Bearer clients that never touch those routes are unaffected.
  # -----------------------------------------------------------------------

  MailerFromAddress:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: >-
      AWESOME_AUTH_MAILER_FROM — the address every auth mail is sent from. It
      MUST be a verified SES identity in this region, or an address under a
      verified domain, because SES rejects anything else. Empty (the default)
      wires no mail transport at all. Placeholder is deliberately empty; never
      commit a real domain.

  MailerFromName:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_MAILER_FROM_NAME — the display name on the From header, and
      the application name the built-in templates greet with and prefix every
      subject with. Empty falls back to the sender address's domain.

  MailerIdentity:
    Type: String
    Default: ''
    Description: >-
      The SES identity the ses:SendEmail grant is scoped to: a verified domain
      ("example.com") or a single verified address
      ("no-reply@example.com"). Empty defaults to the domain of
      MailerFromAddress, which is the common case. Set it explicitly when the
      verified identity is the address rather than the domain, or the send is
      denied. This is an IAM resource name, not a knob the function reads.

  MailerDefaultLang:
    Type: String
    Default: en
    AllowedValues: [en, it]
    Description: >-
      AWESOME_AUTH_MAILER_DEFAULT_LANG — which built-in template set renders the
      four mails. Only the OAuth link-token mail can override it per request.

  EnableSmsDelivery:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Wires SMS one-time codes through SNS publish-to-phone-number. "false"
      leaves POST /sms/send answering 500 SMS_NOT_CONFIGURED, which is the
      reference's behaviour with no sms block, and grants no sns:Publish at all.
      Turning it on has real prerequisites outside this stack: a new account is
      in the SMS sandbox and can only text numbers it has verified, spend limits
      are per-region, and several countries require a registered origination
      identity. Stored numbers must be E.164 — SNS routes nothing else.

  # -----------------------------------------------------------------------
  # Email flows (config-schema.md §1.5). Both empty by default, which leaves the
  # domain untouched; a non-empty value wires it. Site URLs are what the links
  # in every auth mail point at and the origins a magic-link or verification
  # request may name as its return address; the delivery webhook is this
  # port's own extension for exotic transports (no reference wire exists).
  # -----------------------------------------------------------------------

  EmailSiteUrls:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_EMAIL_SITE_URLS — comma-separated absolute URLs. The first is
      the canonical site every emailed link is built on; all of them, together
      with AllowedOrigins, form the allowlist a request's Origin or Referer is
      matched against when a per-request return address is honoured. Empty
      falls back to PublicUrl for the links and honours no request origin.

  EmailDeliveryWebhookUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://.+$'
    Description: >-
      AWESOME_AUTH_EMAIL_DELIVERY_WEBHOOK_URL — an https endpoint that receives a
      signed JSON copy of every credential delivery (kind, recipient, link or
      code) INSTEAD OF SES and SNS: with this set, all five credential seams go
      here and nothing is mailed or texted for them. Empty disables it. Set it
      only for a receiver you control: it is handed the credentials, and
      EmailDeliveryWebhookSecretArn is required with it.

  EmailDeliveryWebhookSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: >-
      ARN of an existing Secrets Manager secret holding the key that signs every
      delivery webhook request (X-Webhook-Signature: sha256=<hex HMAC-SHA256 of
      the body>). REQUIRED whenever EmailDeliveryWebhookUrl is set, and refused
      without it: every request carries a credential, so a receiver that cannot
      verify the signature cannot tell a replay or a forgery from a real
      delivery. Nothing is generated for you here — the receiver has to be
      configured with the same key, which only you can do. Append #<jsonKey> to
      select one key of a JSON secret document. The function reads it at cold
      start; the value never enters the template.

  # -----------------------------------------------------------------------
  # Second factor and token claims (config-schema.md §1.1, §1.8). The TOTP
  # issuer always applies; the claims webhook is off unless a url is given, and
  # then its signing secret is required. security.jwt.extraClaims is a mapping
  # table with no environment form at all — it arrives in the configuration
  # document (ConfigFile below), like every other structured knob.
  # -----------------------------------------------------------------------

  TotpIssuer:
    Type: String
    Default: awesome-node-auth
    MinLength: 1
    Description: >-
      AWESOME_AUTH_2FA_APP_NAME — the name an authenticator app shows above the
      six digits, and the issuer in the otpauth:// URI POST /2fa/setup returns.
      It is what a user reads to tell one enrolment from another, so set it to
      the product name they know. The default is the reference's literal;
      an empty value is refused at start.

  ClaimsWebhookUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://.+$'
    Description: >-
      AWESOME_AUTH_JWT_CLAIMS_WEBHOOK_URL — an https endpoint asked for extra
      token claims on every mint (login, refresh, 2FA step-up) and on GET /me.
      It is POSTed {"user": <the profile as /me renders it>} and answers
      {"claims": {...}}. Empty disables it. It CANNOT set sid, tid, jti, typ,
      iss, iat or exp — the library writes those after the merge — but it can
      override the six base claims, so point this only at a receiver you own.
      A failure or timeout fails the mint: login answers 500 rather than issuing
      a token with fewer claims than the deployment configured.

  ClaimsWebhookTimeoutMs:
    Type: Number
    Default: 2000
    MinValue: 1
    MaxValue: 10000
    Description: >-
      AWESOME_AUTH_JWT_CLAIMS_WEBHOOK_TIMEOUT_MS — one request, connect to last
      byte. A login is waiting on this inside a Lambda invocation, so keep it
      well under Timeout below; the whole invocation fails if the function times
      out first, and this deadline is what turns a slow receiver into a fast 500
      instead. MaxValue is not the only guard: the loader refuses anything above
      10000 whatever route the value arrives by, so the same ceiling holds for
      the configuration document and for a variable set outside this template.

  ClaimsWebhookSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: >-
      ARN of an existing Secrets Manager secret holding the key that signs every
      claims request (X-Webhook-Signature: sha256=<hex HMAC-SHA256 of the body>).
      REQUIRED whenever ClaimsWebhookUrl is set, and refused without it: the
      request body is the user profile and the answer decides what the token
      authorises, so an unsigned receiver can neither tell this deployment's
      question from anybody else's nor be told apart from a receiver that is
      not it. Nothing is generated for you — the receiver has to be configured
      with the same key. Append #<jsonKey> to select one key of a JSON secret.
      The function reads it at cold start; the value never enters the template.

  # -----------------------------------------------------------------------
  # OAuth providers (config-schema.md §1.7). The two built-in names only: their
  # endpoints and scopes are fixed, so a client id and a client secret are the
  # whole configuration, and the callback URL is DERIVED rather than asked for
  # (PublicUrl + ApiPrefix + /oauth/<provider>/callback) — a URL the operator
  # typed and a URL the function serves that disagree is a flow that dead-ends
  # at the provider's redirect_uri check, so there is nothing to be gained by
  # letting them differ. Register that same URL with the provider.
  #
  # A generic provider needs three endpoints, a scope and usually a profile map,
  # which is more structure than a flat parameter list can carry: configure it
  # in the JSON document (ConfigFile) instead, where every knob of §1.7 is
  # available and its client secret is a {"secretsManager": …} reference.
  #
  # Empty client id = provider off. Setting one also switches
  # AWESOME_AUTH_STORES_ENABLE_LINKED_ACCOUNTS on, because that store is where
  # the callback binds a provider identity to an account and RS-11 refuses a
  # provider without it.
  #
  # The Rules section below refuses the parameter combinations that would deploy
  # a stack whose cold start then fails: a provider without PublicUrl (always,
  # since the callback URL is derived here), and — only when no ConfigFile is
  # supplied, because a document can answer both — a provider without a redirect
  # allowlist or without its client secret.
  # -----------------------------------------------------------------------

  OAuthGoogleClientId:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_OAUTH_GOOGLE_CLIENT_ID — the OAuth client id from the Google
      Cloud console, e.g. 123456789-abc.apps.googleusercontent.com. Empty
      switches Google sign-in off, and GET <ApiPrefix>/oauth/google then answers
      the reference's 404 stub. A client id is not a secret; the client SECRET
      is, and it goes in OAuthGoogleClientSecretArn.

  OAuthGoogleClientSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: >-
      ARN of an existing Secrets Manager secret holding the Google OAuth client
      secret. REQUIRED whenever OAuthGoogleClientId is set. Nothing is generated
      for you: the value comes from the provider's console, and only you can put
      it there. Append #<jsonKey> to select one key of a JSON secret document.
      The function reads it at cold start; the value never enters the template.

  OAuthGithubClientId:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_OAUTH_GITHUB_CLIENT_ID — the client id of the GitHub OAuth
      app, e.g. Iv1.0123456789abcdef. Empty switches GitHub sign-in off.

  OAuthGithubClientSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: >-
      ARN of an existing Secrets Manager secret holding the GitHub OAuth client
      secret. REQUIRED whenever OAuthGithubClientId is set. As above: supplied,
      never generated, and read by the function at cold start.

  # -----------------------------------------------------------------------
  # Identity provider (config-schema.md §1.10 and its P5 addendum).
  #
  # Turning this on makes the deployment an OIDC issuer: it publishes a JWKS
  # document at <ApiPrefix>/.well-known/jwks.json, serves a discovery document
  # beside it, and mounts /authorize, /token and /userinfo. It changes nothing
  # about /login and /refresh, which keep issuing the HS256 session tokens every
  # client in the family reads (decisions.md D-3).
  #
  # The signing key is a KMS asymmetric key, and the stack creates one unless you
  # name your own. That is the whole reason this block exists as infrastructure
  # rather than as one more secret: an RSA private key in Secrets Manager is a
  # value the function reads at cold start and can leak, while a KMS key is one
  # it can only ask to sign — the private half never exists outside KMS, every
  # signature is a CloudTrail event, and revoking the capability is an IAM edit.
  #
  # RELYING PARTIES ARE CONFIGURED IN THE DOCUMENT, not here. A client is a
  # client id, a secret reference and a redirect-URI allowlist — an array of
  # objects, which no environment variable can express — so `idProvider.clients`
  # is file-only and arrives through ConfigFile. Each client's secret is an
  # ordinary secret knob: AWESOME_AUTH_IDP_CLIENT_<CLIENTID>_SECRETSMANAGER
  # names the Secrets Manager entry, and the role needs a read on it (add a
  # statement like ReadDeliveryWebhookSigningSecret below).
  #
  # Leaving EnableIdp false costs nothing and creates nothing.
  # -----------------------------------------------------------------------

  EnableIdp:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      AWESOME_AUTH_IDP_ENABLED. "true" mounts the OIDC surface and creates a KMS
      signing key unless IdpKmsKeyId names one. See the KMS key's own cost note:
      a customer managed key is billed monthly whether or not it signs anything.

  IdpIssuer:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://.+$'
    Description: >-
      AWESOME_AUTH_IDP_ISSUER — the iss claim and the base of every endpoint in
      the discovery document. Empty derives it from PublicUrl + ApiPrefix, which
      is right for a custom domain and impossible on a raw execute-api URL (the
      function cannot know its own endpoint; see the note on
      AWESOME_AUTH_DEPLOYMENT_PUBLIC_URL). On a raw execute-api URL, deploy once,
      read the ApiEndpoint output, and set this to <ApiEndpoint><ApiPrefix>.
      Placeholder is deliberately empty; never commit a real domain.

  IdpKmsKeyId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[a-z0-9-]+:kms:[a-z0-9-]+:[0-9]{12}:key/.+$'
    Description: >-
      ARN of an existing KMS asymmetric key (KeySpec RSA_2048 or larger,
      KeyUsage SIGN_VERIFY) that signs every RS256 token. Empty (the default)
      creates one inside the stack. A KEY ARN and not an alias: the same value is
      the IAM policy's Resource, and IAM matches key ARNs — a grant on an alias
      ARN authorises nothing. Retired keys, whose tokens are still in flight, go
      in IdpPreviousKmsKeyArns below.

  IdpPreviousKmsKeyArns:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      AWESOME_AUTH_IDP_KMS_PREVIOUS_KEY_IDS — key ARNs that no longer sign but
      whose tokens are still in flight, published in the JWKS document beside
      the current key so those tokens keep verifying. Empty (the default) is one
      key and no rotation. THIS IS STEP 1 OF A ROTATION AND IT IS NOT OPTIONAL:
      the function calls kms:GetPublicKey on every id listed here at cold start,
      so an id the policy does not cover fails the init with AccessDeniedException
      naming idProvider.kmsPreviousKeyIds. Listing them here is what grants that
      read — kms:Sign stays on the current key alone, because a retired key must
      not be able to sign. Key ARNs, not aliases, for the same reason as
      IdpKmsKeyId. Drop an id once the last token it signed has expired; see
      docs/oidc.md §3.

  IdpJwksPath:
    Type: String
    Default: ''
    AllowedPattern: '^$|^/.*$'
    Description: >-
      AWESOME_AUTH_IDP_JWKS_PATH — where the JWKS document is served, relative to
      the api prefix. Empty (the default) is /.well-known/jwks.json, which is
      what the reference serves and what the JwksUrl output assumes. Set it here
      rather than in ConfigFile if you move it, so that the output keeps naming
      the URL that answers; whatever the path, the discovery document's jwks_uri
      is the authority.

  # -----------------------------------------------------------------------
  # Resource server (config-schema.md §1.11).
  #
  # The mirror image of the block above: this deployment mints nothing and
  # verifies tokens another issuer signed, against that issuer's JWKS. Turning it
  # on UNMOUNTS the whole credential surface — all nineteen routes that create,
  # prove, deliver or change a credential, /register and /login among them — so
  # do not turn it on for a stack that is supposed to log people in.
  #
  # NOT TOGETHER WITH EnableIdp. The two describe opposite deployments, and the
  # function refuses to start when both are on (rule IDENTITY): the identity
  # provider mounts POST <prefix>/authorize, which takes an email and a password,
  # so a stack with both would serve a credential route while claiming to have
  # removed every one of them. CloudFormation cannot see that — the refusal is at
  # init, and a stack deployed with both looks successful until the first request
  # 500s and the log names the rule.
  #
  # The verifier it builds is NOT mounted on anything in this artifact: this
  # function serves the imported adapter's route table and nothing else, and the
  # guard is exported (App.ResourceServerGuard) for a host that embeds the
  # package. In this stack, turning the knob on removes nineteen routes and adds
  # no verification to the ones that remain. docs/oidc.md §4.
  # -----------------------------------------------------------------------

  EnableResourceServer:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      AWESOME_AUTH_RS_ENABLED. "true" unmounts every credential route and builds
      the RS256 verifier the deployment's own routes are guarded with.
      ResourceServerJwksUrl is required with it (RS-8 refuses an empty or
      non-https one at startup).

  ResourceServerJwksUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://.+$'
    Description: >-
      AWESOME_AUTH_RS_JWKS_URL — the issuer's JWKS endpoint, e.g.
      https://auth.example.com/auth/.well-known/jwks.json. Fetched with a bounded
      timeout and cached for an hour; an issuer that is briefly unreachable keeps
      serving from the stale document rather than taking this stack down.

  ResourceServerIssuer:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_RS_ISSUER — the exact iss claim to require. Empty means the
      claim is not checked, which is the reference's behaviour and one this stack
      warns about at cold start: any issuer whose key ends up in that JWKS
      document would then be accepted.

  # -----------------------------------------------------------------------
  # Migration off Amazon Cognito (stores.migration.*).
  #
  # Two halves that switch on separately, because a migration has two phases and
  # a stack spends most of its life in the second:
  #
  #   * The records cross in bulk, through `migrate cognito`, which is an
  #     operator command run from a workstation and NOT part of this stack. It
  #     needs cognito-idp:ListUsers, which is granted below so the same role can
  #     be assumed for it, and it writes rows carrying an empty passwordHash and
  #     a migration marker.
  #   * The passwords cross one at a time, on each person's next login, through
  #     the password-verifier seam. That is what CognitoAppClientId turns on, and
  #     it is the half to turn OFF once the migration has finished: with it
  #     empty, this function never calls the pool on its login path.
  #
  # An empty CognitoUserPoolId adds NO policy statement and NO cost. Every
  # statement below is inside a condition on it.
  #
  # The pool is addressed by a parameter and not discovered: it commonly lives in
  # another account, and CognitoRegion is required with it because a pool
  # addressed in the wrong region answers "no such user" for every person, which
  # is indistinguishable from an empty pool. RS-13 refuses the combination at
  # startup rather than leaving it to be discovered from a failed login.
  # -----------------------------------------------------------------------

  CognitoUserPoolId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9-]+_[A-Za-z0-9]+$'
    Description: >-
      AWESOME_AUTH_STORES_MIGRATION_USER_POOL_ID — the Cognito user pool being
      migrated away from, e.g. <region>_XXXXXXXXX. Empty (the default) disables
      the whole migration block: no IAM statement is added and nothing about the
      running function changes.

  CognitoRegion:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_STORES_MIGRATION_REGION — the region the pool lives in.
      Required with CognitoUserPoolId (RS-13) and deliberately not inherited from
      this stack's region: the commonest migration is out of a pool in another
      region or another account.

  CognitoAppClientId:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_STORES_MIGRATION_CLIENT_ID — an app client in that pool, with
      ALLOW_ADMIN_USER_PASSWORD_AUTH among its explicit auth flows and NO client
      secret. It turns just-in-time password migration on. Empty keeps the import
      and the dual read without any login ever calling the pool; clear it once
      the migration has finished.

  CognitoMigrationMode:
    Type: String
    Default: import-only
    AllowedValues: [import-only, dual-read]
    Description: >-
      AWESOME_AUTH_STORES_MIGRATION_MODE. "dual-read" additionally falls a user
      lookup that misses through to the pool and creates the local row, which is
      the safety net while the bulk import is incomplete — and one call to
      Cognito per miss on unauthenticated routes. Turn it back to import-only
      once the import has been verified. docs/cognito-migration.md §4.

  # -----------------------------------------------------------------------
  # Configuration document. File-only knobs (templates directory, extra claims,
  # OAuth profile maps, OIDC clients, rate-limit scopes) have no environment
  # variable by design; they arrive as a JSON document baked into the artifact by
  # scripts/build-lambda.sh CONFIG_FILE=… and named here.
  # -----------------------------------------------------------------------

  ConfigFile:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_CONFIG_FILE — path of the JSON configuration document inside
      the deployed artifact, normally /var/task/awesome-auth.json when the build
      baked one. Empty means defaults plus the environment variables above.

  TableNamePrefix:
    Type: String
    Default: awesome-auth
    AllowedPattern: '^[A-Za-z0-9_.-]{1,80}$'
    Description: Table is named <prefix>-<stack name>.

  MaxReadRequestUnits:
    Type: Number
    Default: 200
    MinValue: 1
    Description: >-
      On-demand read ceiling (data-model.md §6.1). A credential-stuffing run is
      a DynamoDB bill before it is an outage, so the ceiling is set rather than
      left unbounded. Raise it deliberately.

  MaxWriteRequestUnits:
    Type: Number
    Default: 200
    MinValue: 1
    Description: On-demand write ceiling (data-model.md §6.1).

  EnableDeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      data-model.md §6.1 wants this on. It defaults to off here so the
      quickstart can be torn down in one command; turn it on for anything
      holding real users, and note that scripts/teardown.sh then needs
      --disable-deletion-protection.

  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: >-
      Login is CPU-bound on bcrypt (cost 12). Lambda bills GB-ms, so 1024
      roughly halves login latency at about the same cost per request — worth
      it if p99 matters to you.

  Timeout:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 29
    Description: >-
      Seconds. Not the 15-minute default: nothing in the auth router should
      take longer than an API Gateway integration is willing to wait (29s).

  # Concurrency. This is the only HARD stop in the stack, and it is off by
  # default — see the AlarmEmail note below for why nothing else here is one.
  #
  # An alarm tells you a runaway is running. A reservation stops it: the function
  # cannot exceed this many simultaneous execution environments, and Lambda
  # answers 429 (TooManyRequestsException) past it, which the Errors and Throttles
  # alarms then report. That bounds the bill of a recursive invocation, of an SSE
  # long-poll that never closes, and of a credential-stuffing run, in the only way
  # a bill can actually be bounded — by refusing work.
  #
  # It is empty by default because the refusal is indiscriminate: past the
  # reservation real logins get the same 429 as the runaway, so a number set too
  # low is a self-inflicted outage. It also *removes* that concurrency from the
  # account's unreserved pool, where every other function in the region draws
  # from, so the number is an account-wide decision and not a stack-local one.
  #
  # Pick it from measured duration, not from imagination: at ~300 ms a login
  # (README "Measured on a real deployment"), one reserved execution environment
  # sustains a little over three logins a second, so 20 is ~60 logins/s — far
  # above anything this deployment has seen and far below an account's default
  # 1 000. Zero is NOT "unset": Lambda reads a reservation of 0 as "throttle
  # everything", which is why the sentinel is the empty string.
  ReservedConcurrentExecutions:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]{1,5}$'
    ConstraintDescription: >-
      ReservedConcurrentExecutions must be a whole number of execution
      environments, or empty for no reservation. Note that 0 is a real value and
      means "throttle every invocation".
    Description: >-
      Cap the function's simultaneous execution environments. Empty — the
      default — reserves nothing and leaves it drawing on the account pool. This
      is the only hard spend limit in the stack; everything else here is an
      alert.

  SessionCheckOn:
    Type: String
    Default: refresh
    AllowedValues: [allcalls, refresh, none]
    Description: >-
      AWESOME_AUTH_SESSIONS_CHECK_ON. "allcalls" costs one strongly-consistent
      GetItem on every authenticated request and buys immediate revocation on
      the auth routes. It does not reach the admin console: its guard verifies
      the token and never consults the session store, so a revoked session's
      access token, and the console's own 24-hour admin token, stay admin
      credentials until they expire.

  # -----------------------------------------------------------------------
  # Content delivery. The hosted UI is served by the function, from assets
  # embedded in the binary, at <ApiPrefix>/ui — so the pages and the API they
  # post to are the same origin by construction and there is no second bucket,
  # no second deployment and no CORS between them. What CloudFront adds is the
  # *front door*: one hostname in front of that origin, at which a custom domain
  # can be attached.
  #
  # THIS IS NOT A CACHE, AND THE RESOURCES BELOW SAY SO IN AS MANY WORDS. See
  # AuthCachePolicy for why nothing this origin serves is shared-cacheable.
  #
  # Off by default, and off means no resource and no bill: with
  # EnableCloudFront "false" the distribution, the cache policy and the origin
  # request policy are all conditioned away and the stack is byte for byte the
  # stack it was before this block existed.
  # -----------------------------------------------------------------------

  EnableCloudFront:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Put a CloudFront distribution in front of the HTTP API, so the hosted UI
      and the auth routes share one hostname that a custom domain can be
      attached to. "false" — the default — creates nothing. CloudFront has no
      fixed monthly charge and its perpetual free tier covers 10,000,000 HTTPS
      requests and 1 TB out per month; data transfer from API Gateway to
      CloudFront is not billed.

  CloudFrontAliases:
    Type: String
    Default: ''
    Description: >-
      Comma-separated custom domains to serve the distribution at, e.g.
      auth.example.com. Requires CloudFrontCertificateArn. Empty — the default —
      leaves the distribution on its own *.cloudfront.net name, which is a
      SHARED registrable domain exactly as execute-api.amazonaws.com is: it does
      not satisfy RS-2 and does not let you run cookie mode with
      AllowInsecureCookieMode "false". An alias does. Placeholder is empty on
      purpose; never commit a real domain.

  CloudFrontCertificateArn:
    Type: String
    Default: ''
    # us-east-1 is not a preference. CloudFront reads viewer certificates from
    # ACM in us-east-1 only, whatever region the rest of this stack is in.
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:acm:us-east-1:\d{12}:certificate/.+$'
    ConstraintDescription: >-
      CloudFrontCertificateArn must be an ACM certificate ARN in us-east-1 —
      CloudFront reads viewer certificates from that region only — or empty.
    Description: >-
      ACM certificate covering CloudFrontAliases, in us-east-1. This template
      does not create it: a DNS-validated certificate needs a validation record
      in a zone CloudFormation cannot assume it controls, and a stack that hung
      on validation would be worse than one that asks for an ARN. Public ACM
      certificates are free.

  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: >-
      Which edge locations serve the distribution. PriceClass_100 (North America
      and Europe) is the cheapest per GB and per request and is the default
      because nothing here is cached — a distant edge buys a shorter TLS
      handshake and nothing else, so paying for one is paying for latency
      smoothing, not for hit rate.

  # -----------------------------------------------------------------------
  # Admin console (config-schema.md §1.13, config-reference.md §16).
  #
  # The reference's admin router, mounted by the function at /admin beside
  # the auth routes, guarded by an access policy the operator names. Off by
  # default: with EnableAdminConsole "false" nothing under /admin is mounted,
  # no variable below is set, and the stack is the stack it was.
  #
  # THREE THINGS TO DO BEFORE TURNING IT ON, in this order:
  #
  #   1. Run `migrate backfill-users --table <TableName output> --region
  #      <region> --profile <yours>` once. The console's user tab and the
  #      first-user policy read a sparse index that only accounts created
  #      since the D6 release are in; older accounts are found by every
  #      other route and missing from those two, and nothing looks wrong
  #      from outside. The sweep is idempotent and safe while serving. It is
  #      an operator command because it is a Scan, which the execution role
  #      below deliberately does not grant.
  #   2. Decide who gets in. AdminAccessPolicy is the whole of that decision
  #      and there is no unguarded default: the function refuses to start
  #      with the console on and no policy (RS-6), and the core refuses to
  #      mount one (admin-console-requires-an-explicit-policy). This template
  #      offers ONE value, is-admin-flag. The reference's two others are
  #      ConfigFile-only here, deliberately: "open" admits every request with
  #      no credential and is for a stack behind a network boundary, which
  #      nothing in this template provides (no WAF, no allow-list, no private
  #      endpoint), so it is accepted only from a document and warned about;
  #      "first-user" is refused at cold start on every driver (RS-17),
  #      because on this product ids are random and the policy would hand the
  #      console to whoever drew the lowest one.
  #   3. Give yourself a way in. Under is-admin-flag nobody is flagged on day
  #      one, so the root user below is how the first administrator logs in
  #      and promotes the second. It is an email and a bcrypt hash in Secrets
  #      Manager -- a hash, never a password, and never in this template.
  #
  # The rbac:<role> and permission:<perm> forms are ConfigFile-only: they
  # need stores.enable.rbac, which is a document knob, and a Rule cannot see
  # the document. The stores behind the console's tabs (metadata, rbac,
  # tenants, apiKeys, webhooks) are likewise switched on in the document.
  #
  # The console is served from the same origin as the auth routes and the
  # hosted UI, so the KNOWN LIMITATION at the top of this file applies to its
  # 24-hour session cookie exactly as it applies to the auth cookies, and one
  # thing more: the console sits outside the CSRF chain by design and its
  # guard accepts the ordinary access-token cookie, so that cookie's SameSite
  # attribute is the only defence its writes have against a cross-site form
  # post. The Rule AdminConsoleNeedsSameSiteCookies refuses the console beside
  # CookieSameSite "none" at changeset time, as RS-18 does at cold start.
  #
  # What the console's session is NOT: revocable. The guard verifies signature,
  # type, issuer and expiry and never consults the session store, so
  # SessionCheckOn "allcalls" buys nothing on this surface, POST /admin/logout
  # only clears the cookie, and an admin token lives its 24 hours whatever
  # happens to the account -- rotating the access-token secret is the one kill
  # switch. Clearing an isAdmin flag has no route on either line; it is a table
  # edit. And the console's own POST /admin/login is password-only: it does not
  # enforce a second factor the deployment requires (config-reference.md §16.2).
  # -----------------------------------------------------------------------

  EnableAdminConsole:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      AWESOME_AUTH_ADMIN_ENABLED. "true" mounts the admin console at /admin,
      guarded by AdminAccessPolicy. Run `migrate backfill-users` against the
      table once before turning this on (see the comment above): the user tab
      reads an index that pre-existing accounts are not in until it runs. The
      console's session is a 24-hour token the session store never sees:
      SessionCheckOn does not apply to it, logout only clears the cookie, and
      rotating the access-token secret is the only way to end one early. Its
      own POST /admin/login does not enforce a second factor.

  AdminAccessPolicy:
    Type: String
    Default: is-admin-flag
    AllowedValues: [is-admin-flag]
    Description: >-
      AWESOME_AUTH_ADMIN_ACCESS_POLICY — who the console admits. "is-admin-flag"
      admits a user whose isAdmin flag is set (POST /admin/users/{id}/promote
      sets it; the root user below is how the first one gets set). It is the
      one value this template offers. "open" (everyone, no credential — the
      reference's default) is ConfigFile-only and only for a stack nobody
      outside your network can reach; "first-user" is refused at cold start
      (RS-17: ids are random here, so it would admit whoever drew the lowest
      one). The rbac:<role> and permission:<perm> forms are set in ConfigFile,
      where stores.enable.rbac can be switched on beside them.

  AdminRootEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: >-
      AWESOME_AUTH_ADMIN_ROOT_EMAIL — the bootstrap administrator's address,
      matched exactly at POST /admin/login. It lives in configuration, not in
      the user table, bypasses the access policy, and is how the first
      administrator gets in under is-admin-flag. Requires
      AdminRootPasswordHashArn; the function refuses to start with one and not
      the other. Empty — the default — configures no root user. Placeholder
      is deliberately empty; never commit an address.

  AdminRootPasswordHashArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: >-
      ARN of an existing Secrets Manager secret holding the root user's bcrypt
      PASSWORD HASH — the output of bcrypt, beginning $2a$/$2b$/$2y$, never the
      password. Nothing is generated for you: hash the password yourself
      (`htpasswd -nBC 12 x | cut -d: -f2`, which prompts for the password
      so it never lands in shell history or the process list — never the -b
      form, which takes it on the command line — or any bcrypt tool) and
      store the hash. REQUIRED whenever AdminRootEmail is set. Append
      #<jsonKey> to select one key of a JSON secret document. The function
      reads it at cold start; the value never enters the template.

  EnableAdminUploads:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Create a private, encrypted S3 bucket for the logos and backgrounds the
      console uploads, and point AWESOME_AUTH_UI_UPLOAD_DIR at it. "false" —
      the default — creates no bucket, grants no S3 permission, and leaves the
      console's upload tab off and the hosted UI's two asset paths answering
      404, which is the reference's behaviour with uploadDir unset. On, the
      bucket costs its storage (cents for a few logos; ~USD 0.023 per GB-month)
      plus ~USD 0.0004 per thousand requests for every page view that fetches
      the logo — see docs/cost-model.md §2.6. The largest file the console can
      take through this API is about 4.4 MiB, not the reference's 5 MiB: a
      multipart body reaches the function base64-encoded inside a 6 MB
      invocation event, and past that API Gateway answers its own 413 body
      before the function runs (config-reference.md §16.5).

  # -----------------------------------------------------------------------
  # Observability, alarms and budget
  # =======================================================================
  #
  # The whole of this section exists because of one asymmetry: this stack costs
  # under a dollar a month at rest and there is no ceiling on what it can cost
  # in an afternoon. Steady-state spend is not the risk — the KMS key at USD
  # 1.00, the two secrets at USD 0.40 each, CloudFront and DynamoDB at zero when
  # idle. The risk is an incident that looks healthy: a function that starts
  # timing out bills its whole timeout on every request, a stream consumer that
  # re-invokes itself runs until something stops it, a log group with no expiry
  # grows forever, and a long-lived connection bills GB-seconds for as long as
  # nobody notices it is still open.
  #
  # **NOTHING BELOW IS A SPENDING CAP, AND AWS DOES NOT SELL ONE.** An alarm and
  # a budget both notify; neither stops a service, and a budget in particular
  # will not turn anything off when it trips. The only hard stop in this template
  # is ReservedConcurrentExecutions above, and the only other real ones are the
  # DynamoDB MaxRead/MaxWriteRequestUnits ceilings. Everything here is how you
  # find out in ten minutes instead of at the end of the month.
  #
  # Costs. Nine standard-resolution alarm metrics, against a CloudWatch
  # always-free allowance of ten — so in an account with no other alarms this
  # section is free, and USD 0.90/month in one that has already spent the
  # allowance. The SNS topic and its subscription cost nothing at rest and are
  # not created at all unless AlarmEmail is set. The budget is the second budget
  # in an account that has the AWS-provided zero-spend one, and the first two per
  # account are free. Cost anomaly detection is free. Prices are at the time of
  # writing, as everywhere else in this file; check them before budgeting on them.
  # -----------------------------------------------------------------------

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: >-
      CloudWatch Logs retention, in days, for EVERY log group this stack owns.
      Never-expire is a slow-growing bill that nobody ever goes back and fixes:
      ~0.50 USD per GB ingested is paid once, ~0.03 per GB-month is paid forever.
      14 days is long enough to debug last week's incident and short enough that
      the stored volume stops growing.

  EnableAlarms:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Create the nine CloudWatch alarms. On by default: they are within the
      always-free ten alarm metrics, and an unmonitored serverless stack is the
      failure mode this section exists to prevent. Turn them off only in an
      account whose free allowance is already spent and where 0.90 USD/month is
      not worth it — or where the alarms are managed centrally somewhere else.

  # The notification target. Empty is the default and empty means NOTHING is
  # created — no topic, no subscription, no charge — and the alarms are then
  # visible in the console with no action attached.
  #
  # It is a parameter and not a literal because an address in a template is a
  # repository-wide leak of somebody's mailbox, and because the address that
  # should receive a production alarm is never the address of whoever wrote the
  # stack. The same goes for the ARN below: neither an account id nor an address
  # is ever committed here.
  #
  # Alarms with no action are decoration, so set one of these for anything real.
  AlarmEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: AlarmEmail must be an email address, or empty.
    Description: >-
      Address to notify. Creates an SNS topic and subscribes this address to it;
      SNS then sends a confirmation mail that MUST be clicked or the subscription
      stays pending and every alarm publishes into nothing. Mutually exclusive
      with AlarmTopicArn. Empty — the default — creates no topic and gives the
      alarms no action.

  AlarmTopicArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:sns:[a-z0-9-]+:\d{12}:[A-Za-z0-9_-]+$'
    ConstraintDescription: AlarmTopicArn must be an SNS topic ARN, or empty.
    Description: >-
      Existing SNS topic to notify instead of creating one — the right choice
      when alerts already go somewhere (a chat bridge, PagerDuty, an account-wide
      topic). It must live in this stack's region, because a CloudWatch alarm can
      only publish to a topic in its own region. If BudgetLimitUsd or
      EnableCostAnomalyDetection is also set, the topic's access policy must let
      budgets.amazonaws.com and costalerts.amazonaws.com publish to it: this
      stack can only write that policy for a topic it owns.

  # Thresholds. Each one is a number this template can defend, not a round figure:
  # see the alarm that consumes it for what incident it is drawn against.
  DurationAlarmThresholdMs:
    Type: Number
    Default: 8000
    MinValue: 1
    MaxValue: 29000
    Description: >-
      Alarm when the function's slowest invocation in a 5-minute window exceeds
      this, twice running. The default is 80% of the default Timeout of 10 s: a
      function that has started timing out bills its entire timeout on every
      request, so the alarm has to fire BEFORE the timeout rather than on it.
      **Raise this whenever you raise Timeout** — the two are coupled and
      CloudFormation cannot do the arithmetic. infra/sam/template_test.go asserts
      the defaults stay in that relationship.

  ConcurrencyAlarmThreshold:
    Type: Number
    Default: 50
    MinValue: 1
    Description: >-
      Alarm when this many execution environments run simultaneously for five
      minutes. At the measured ~300 ms login this is ~165 logins a second
      sustained; at the measured ~1.1 ms /healthz it is far more. It is a smoke
      detector for the three incidents that show up here first — a recursive
      invocation, a long-poll that never closes, a stampede — and not a limit.
      The limit is ReservedConcurrentExecutions.

  CapacityAlarmUnits:
    Type: Number
    Default: 18000
    MinValue: 1
    Description: >-
      Alarm when consumed read or write capacity units total this much in five
      minutes. 18 000 is 60 units a second, 30% of the MaxRead/MaxWriteRequestUnits
      ceiling of 200 — early enough to be a warning rather than an autopsy. The
      write half has a precise meaning here: the rate limiter spends exactly 1 WCU
      per limited request, allowed or refused (internal/store/dynamodb/rate_limit.go),
      so 60 WCU/s sustained for five minutes is ~18 000 credential attempts, which
      is a stuffing run and not a user base.

  LogIngestionAlarmBytes:
    Type: Number
    Default: 26214400
    MinValue: 1
    Description: >-
      Alarm when the auth log group ingests this many bytes in an hour. 25 MiB is
      roughly 65 000 requests an hour at the two lines and few hundred bytes each
      this binary writes per request — traffic this deployment has never seen. It
      catches the thing retention cannot: a loop that logs per iteration, which is
      billed at ~0.50 USD/GB on the way in and is almost always a symptom of the
      incident rather than the incident.

  # Budget. Read the argument at BudgetResource before setting this; the short
  # version is that it is deliberately NOT a second zero-spend budget, because
  # the zero-spend budget an account already has cannot fire while promotional
  # credit is covering the bill.
  BudgetLimitUsd:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Create an AWS Budget at this many USD of GROSS consumption — credits and
      refunds excluded, which is what makes it different from the AWS-provided
      "My Zero-Spend Budget". 0 — the default — creates no budget at all, because
      a template deployed by a stranger must not silently add a budget to their
      account. A budget notifies and NEVER caps: AWS does not stop services when
      one trips.

  BudgetTimeUnit:
    Type: String
    Default: ANNUALLY
    AllowedValues: [MONTHLY, QUARTERLY, ANNUALLY]
    Description: >-
      The period BudgetLimitUsd applies to. ANNUALLY is the default because the
      question a credit-covered deployment has to answer is cumulative ("how much
      of the grant is left"), not monthly; a monthly budget resets every month
      and would never see a slow burn add up. The period begins at the start of
      the current one, so an annual budget created today runs to the end of this
      calendar year.

  EnableCostAnomalyDetection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Create an AWS Cost Anomaly Detection monitor and subscription. Free, and it
      is the one thing here that needs no threshold decided in advance: it learns
      the shape of this account's spend and reports departures from it, which is
      exactly the "0.75 USD/month became 40" case. Requires AlarmEmail or
      AlarmTopicArn. Off by default — see the note on the resources for the one
      caveat, which is that Cost Explorer is a global service and this is the only
      thing in this template that a regional stack might have to create elsewhere.

Conditions:
  IsDefaultStage: !Equals [!Ref StageName, '$default']
  GenerateJwtAccessSecret: !Equals [!Ref JwtAccessSecretArn, '']
  GenerateJwtRefreshSecret: !Equals [!Ref JwtRefreshSecretArn, '']
  # One generated secret serves whichever knobs were left empty, so supplying
  # only one of the two ARNs still works and still generates only what is
  # missing.
  GenerateSigningSecrets: !Or [!Condition GenerateJwtAccessSecret, !Condition GenerateJwtRefreshSecret]
  HasMailer: !Not [!Equals [!Ref MailerFromAddress, '']]
  HasMailerFromName: !Not [!Equals [!Ref MailerFromName, '']]
  HasExplicitMailerIdentity: !Not [!Equals [!Ref MailerIdentity, '']]
  SmsEnabled: !Equals [!Ref EnableSmsDelivery, 'true']
  HasPublicUrl: !Not [!Equals [!Ref PublicUrl, '']]
  HasAllowedOrigins: !Not [!Equals [!Ref AllowedOrigins, '']]
  HasCookieDomain: !Not [!Equals [!Ref CookieDomain, '']]
  HasEmailSiteUrls: !Not [!Equals [!Ref EmailSiteUrls, '']]
  HasDeliveryWebhook: !Not [!Equals [!Ref EmailDeliveryWebhookUrl, '']]
  HasDeliveryWebhookSecret: !Not [!Equals [!Ref EmailDeliveryWebhookSecretArn, '']]
  HasClaimsWebhook: !Not [!Equals [!Ref ClaimsWebhookUrl, '']]
  HasClaimsWebhookSecret: !Not [!Equals [!Ref ClaimsWebhookSecretArn, '']]
  HasConfigFile: !Not [!Equals [!Ref ConfigFile, '']]
  HasOAuthGoogle: !Not [!Equals [!Ref OAuthGoogleClientId, '']]
  HasOAuthGithub: !Not [!Equals [!Ref OAuthGithubClientId, '']]
  HasAnyOAuthProvider: !Or [!Condition HasOAuthGoogle, !Condition HasOAuthGithub]

  IdpEnabled: !Equals [!Ref EnableIdp, 'true']
  HasIdpIssuer: !Not [!Equals [!Ref IdpIssuer, '']]
  HasIdpKmsKeyId: !Not [!Equals [!Ref IdpKmsKeyId, '']]
  # A CommaDelimitedList has no empty test of its own: joining it with no
  # separator turns the empty list into the empty string, and any non-empty list
  # into something that is not.
  HasIdpPreviousKmsKeyArns: !Not [!Equals [!Join ['', !Ref IdpPreviousKmsKeyArns], '']]
  RotatingIdpKeys: !And [!Condition IdpEnabled, !Condition HasIdpPreviousKmsKeyArns]
  HasIdpJwksPath: !Not [!Equals [!Ref IdpJwksPath, '']]
  # The stack owns a signing key only when the IdP is on and the operator did
  # not bring one. Both halves matter: creating a key for a disabled IdP would
  # bill a dollar a month for nothing, and creating one alongside a supplied ARN
  # would leave two keys and no rule for which signs (RS-4 refuses that shape in
  # the configuration; this keeps the stack from producing it).
  CreateIdpSigningKey: !And [!Condition IdpEnabled, !Not [!Condition HasIdpKmsKeyId]]
  # The pool id is the switch for the whole block, matching stores.migration's
  # own shape: with no pool there is nothing to import from, nothing to fall
  # through to and nothing to ask about a password.
  MigratingFromCognito: !Not [!Equals [!Ref CognitoUserPoolId, '']]
  HasCognitoAppClient: !And
    - !Condition MigratingFromCognito
    - !Not [!Equals [!Ref CognitoAppClientId, '']]
  ResourceServerEnabled: !Equals [!Ref EnableResourceServer, 'true']
  HasResourceServerIssuer: !Not [!Equals [!Ref ResourceServerIssuer, '']]
  # A named stage on the raw execute-api URL puts /<stage> in front of every
  # path the browser sees, so the Path-scoped refresh cookie has to match.
  #
  # Behind the distribution it does not: the origin carries the stage in its
  # OriginPath, so the browser sees paths with no stage segment in them. That is
  # why the distribution is a reason to set PublicUrl — which is what turns this
  # condition off — and why the parameter description says so rather than this
  # condition growing a third term. A stack can legitimately be reachable both
  # ways at once, and only the operator knows which URL their clients use.
  NeedsStagePrefixedCookiePath: !And
    - !Not [!Condition IsDefaultStage]
    - !Not [!Condition HasPublicUrl]

  CloudFrontEnabled: !Equals [!Ref EnableCloudFront, 'true']
  HasCloudFrontAliases: !Not [!Equals [!Ref CloudFrontAliases, '']]
  HasCloudFrontCertificate: !Not [!Equals [!Ref CloudFrontCertificateArn, '']]

  # The admin console. The switch gates every admin variable, the root user's
  # pair included: HasAdminRootPasswordHash carries the switch as its first
  # term, so a console turned off leaves no root-user variable behind and no
  # IAM read of the hash -- a function that fetched a secret at cold start for
  # a console it does not mount would be a permission it does not need. The
  # root user's two halves are conditioned together so that a hash ARN without
  # an email is inert (no variable, no IAM read) rather than half-configured,
  # and the Rule below refuses the other half-shape. The bucket is its own
  # switch: it is the UI's read side as much as the console's write side, and
  # a deployment may keep serving uploaded logos with the console turned off.
  AdminConsoleEnabled: !Equals [!Ref EnableAdminConsole, 'true']
  HasAdminRootEmail: !Not [!Equals [!Ref AdminRootEmail, '']]
  HasAdminRootPasswordHash: !And
    - !Condition AdminConsoleEnabled
    - !Condition HasAdminRootEmail
    - !Not [!Equals [!Ref AdminRootPasswordHashArn, '']]
  AdminUploadsEnabled: !Equals [!Ref EnableAdminUploads, 'true']

  # Observability. HasAlarmTarget is the one every notifying resource is gated
  # on: with neither parameter set, no topic is created, no subscription exists,
  # no address appears anywhere, and the alarms carry no AlarmActions at all.
  AlarmsEnabled: !Equals [!Ref EnableAlarms, 'true']
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasExternalAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]
  CreateAlarmTopic: !And [!Condition HasAlarmEmail, !Not [!Condition HasExternalAlarmTopic]]
  HasAlarmTarget: !Or [!Condition CreateAlarmTopic, !Condition HasExternalAlarmTopic]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrentExecutions, '']]
  BudgetEnabled: !Not [!Equals [!Ref BudgetLimitUsd, '0']]
  BudgetNotifies: !And [!Condition BudgetEnabled, !Condition HasAlarmTarget]
  CostAnomalyDetectionEnabled: !And
    - !Equals [!Ref EnableCostAnomalyDetection, 'true']
    - !Condition HasAlarmTarget

# ---------------------------------------------------------------------------
# Rules are evaluated before a changeset is created, which is the only place a
# parameter combination can be refused with the stack still running — it turns
# an init failure and a rollback into a message before anything is touched.
#
# What a Rule can see is the limit of what it may assert. Rules resolve against
# parameters and nothing else: not Conditions, not Resources, and — the one that
# matters here — not the contents of ConfigFile, which is a full JSON
# configuration document and a first-class source for every knob of
# config-schema.md §1. email.siteUrls, http.cors.origins and a provider's
# clientSecret as a {"secretsManager": …} reference are all legitimately
# supplied there, so a rule that asserts the corresponding *parameter* is
# non-empty would refuse a stack the function would start happily.
#
# So each rule below falls into one of two shapes:
#
#   * parameter-only — the value has no document equivalent because this
#     template is what consumes it. OAuthCallbacksNeedAPublicUrl is the only
#     one: the callback env var is derived here, by !Sub, from PublicUrl.
#   * document-aware — the knob can come from either source, so the rule also
#     asserts ConfigFile is empty and steps aside when a document is supplied.
#     The cold-start rules then do the checking, and they see both sources
#     (config-schema.md §2, RS-11).
# ---------------------------------------------------------------------------
Rules:

  # The callback URL registered with the provider is PublicUrl + ApiPrefix +
  # /oauth/<provider>/callback. It cannot be derived from this stack's own
  # execute-api URL: referencing HttpApi from the function's environment is a
  # circular dependency (see the note on AWESOME_AUTH_DEPLOYMENT_PUBLIC_URL), and
  # a raw execute-api URL is the wrong thing to register with a provider anyway.
  OAuthCallbacksNeedAPublicUrl:
    RuleCondition: !Or
      - !Not [!Equals [!Ref OAuthGoogleClientId, '']]
      - !Not [!Equals [!Ref OAuthGithubClientId, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref PublicUrl, '']]
        AssertDescription: >-
          An OAuth provider needs PublicUrl. The callback URL this stack serves is
          <PublicUrl><ApiPrefix>/oauth/<provider>/callback, and it is the URL you
          register with Google or GitHub; with PublicUrl empty there is no origin
          to build it from. Set PublicUrl to the custom domain clients reach.

  # RS-11's second half: the callback answers with a fresh session in a
  # Set-Cookie and decides where to send the browser from the origin inside the
  # state. With nothing allowlisted, any origin the state names is honoured
  # (reference-issues N1), so the function refuses to start.
  #
  # Document-aware: email.siteUrls and http.cors.origins are both knobs a
  # ConfigFile can carry, and a Rule cannot read one. With a document supplied
  # this steps aside and RS-11 does the checking at cold start, where both
  # sources are visible.
  OAuthNeedsARedirectAllowlist:
    RuleCondition: !And
      - !Or
        - !Not [!Equals [!Ref OAuthGoogleClientId, '']]
        - !Not [!Equals [!Ref OAuthGithubClientId, '']]
      - !Equals [!Ref ConfigFile, '']
    Assertions:
      - Assert: !Or
          - !Not [!Equals [!Ref EmailSiteUrls, '']]
          - !Not [!Equals [!Ref AllowedOrigins, '']]
        AssertDescription: >-
          An OAuth provider needs a redirect allowlist (refuse-to-start rule RS-11).
          Set EmailSiteUrls to the front-end origins the callback may send a browser
          back to — they are also the base of every emailed link — or AllowedOrigins
          if this deployment only ever redirects to its CORS origins.

  # A client id with no secret is a provider that fails RS-11 at cold start; a
  # secret ARN with no client id is a Secrets Manager entry nothing reads and a
  # sign-in button nobody gets.
  #
  # The first of each pair is document-aware: clientSecret is a secret-tagged
  # knob, so a document may reference it as {"secretsManager": …} without this
  # parameter. The second is parameter-only and stays unconditional — the secret
  # env var below is emitted only when the *parameter* client id is set, so an
  # ARN parameter with an empty client id parameter really is read by nothing,
  # whatever the document says.
  GoogleOAuthNeedsItsClientSecret:
    RuleCondition: !And
      - !Not [!Equals [!Ref OAuthGoogleClientId, '']]
      - !Equals [!Ref ConfigFile, '']
    Assertions:
      - Assert: !Not [!Equals [!Ref OAuthGoogleClientSecretArn, '']]
        AssertDescription: >-
          OAuthGoogleClientId is set, so OAuthGoogleClientSecretArn must name the
          Secrets Manager secret holding the client secret. The token exchange
          presents it; without one the provider block is incomplete (RS-11).

  GoogleOAuthSecretNeedsItsClientId:
    RuleCondition: !Not [!Equals [!Ref OAuthGoogleClientSecretArn, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref OAuthGoogleClientId, '']]
        AssertDescription: >-
          OAuthGoogleClientSecretArn is set but OAuthGoogleClientId is empty, so no
          Google provider is configured and the secret would be read by nothing.
          Set the client id, or clear the ARN.

  # RS-13's region clause, moved forward to the changeset. Both halves are
  # parameter-only: the IAM statement's Resource is built here by !Sub from the
  # pool id and CognitoRegion, so a document that supplied the region would still
  # leave this template unable to write the ARN. That is why neither of these
  # steps aside for a ConfigFile, unlike the OAuth rules above.
  CognitoMigrationNeedsARegion:
    RuleCondition: !Not [!Equals [!Ref CognitoUserPoolId, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CognitoRegion, '']]
        AssertDescription: >-
          CognitoUserPoolId is set, so CognitoRegion must name the region the pool
          lives in (refuse-to-start rule RS-13). It is not inherited from this
          stack's region on purpose: the commonest migration is out of a pool in
          another region or another account, and a pool addressed in the wrong
          region answers "no such user" for every person -- indistinguishable from
          an empty pool. The IAM statement's Resource ARN is built from it too.

  CognitoAppClientNeedsItsPool:
    RuleCondition: !Not [!Equals [!Ref CognitoAppClientId, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CognitoUserPoolId, '']]
        AssertDescription: >-
          CognitoAppClientId is set but CognitoUserPoolId is empty, so the whole
          migration block is off and the app client would be read by nothing. Set
          the pool id, or clear the app client id.

  GithubOAuthNeedsItsClientSecret:
    RuleCondition: !And
      - !Not [!Equals [!Ref OAuthGithubClientId, '']]
      - !Equals [!Ref ConfigFile, '']
    Assertions:
      - Assert: !Not [!Equals [!Ref OAuthGithubClientSecretArn, '']]
        AssertDescription: >-
          OAuthGithubClientId is set, so OAuthGithubClientSecretArn must name the
          Secrets Manager secret holding the client secret (RS-11).

  GithubOAuthSecretNeedsItsClientId:
    RuleCondition: !Not [!Equals [!Ref OAuthGithubClientSecretArn, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref OAuthGithubClientId, '']]
        AssertDescription: >-
          OAuthGithubClientSecretArn is set but OAuthGithubClientId is empty, so no
          GitHub provider is configured and the secret would be read by nothing.
          Set the client id, or clear the ARN.

  # Both parameter-only, in the shape the header describes: neither value has a
  # ConfigFile equivalent, because this template is what consumes them. They are
  # a pair — CloudFront refuses a distribution carrying an alias with no viewer
  # certificate — and refusing here turns a failed changeset into a message
  # before anything is touched.
  CloudFrontAliasesNeedACertificate:
    RuleCondition: !Not [!Equals [!Ref CloudFrontAliases, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CloudFrontCertificateArn, '']]
        AssertDescription: >-
          CloudFrontAliases needs CloudFrontCertificateArn. A distribution serving
          a custom domain has to present a certificate for it, and CloudFront reads
          viewer certificates from ACM in us-east-1 only — whatever region the rest
          of this stack is in. Request or import the certificate there and pass its
          ARN.

  CloudFrontCertificateNeedsAnAlias:
    RuleCondition: !Not [!Equals [!Ref CloudFrontCertificateArn, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CloudFrontAliases, '']]
        AssertDescription: >-
          CloudFrontCertificateArn is set but CloudFrontAliases is empty, so the
          distribution would keep its *.cloudfront.net name and present the default
          certificate — the one you supplied would be attached to nothing. Set the
          domains, or clear the ARN.

  # Both notification parameters name the same thing, and honouring one silently
  # over the other is how an operator ends up watching a topic nothing publishes
  # to. Refusing the pair costs one redeploy and removes a whole class of "the
  # alarm never fired" — which is the only failure mode of an alarm that matters.
  # Parameter-only: the hash arrives as an ARN this template hands to the
  # function and to IAM, so the pairing is knowable here. An email with no
  # hash is a root login that is served and can never succeed; the function
  # refuses it at cold start too (cmd/auth/admin.go, checkAdminRootUser), but
  # a Rule refuses it before anything is touched.
  AdminRootUserNeedsItsPasswordHash:
    RuleCondition: !Not [!Equals [!Ref AdminRootEmail, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref AdminRootPasswordHashArn, '']]
        AssertDescription: >-
          AdminRootEmail is set, so AdminRootPasswordHashArn must name the
          Secrets Manager secret holding that user's bcrypt password hash.
          Without it the root login is served and can never succeed.

  # RS-18 at changeset time. The console sits outside the CSRF chain and its
  # guard accepts the ordinary access-token cookie, so that cookie's SameSite
  # attribute is the only thing between a cross-site form post and every admin
  # write, promote included. Parameter-only: both knobs are parameters here,
  # and the function refuses the same pair at cold start for a document.
  AdminConsoleNeedsSameSiteCookies:
    RuleCondition: !Equals [!Ref EnableAdminConsole, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref CookieSameSite, 'none']]
        AssertDescription: >-
          EnableAdminConsole is true, so CookieSameSite cannot be "none": the
          admin console has no CSRF check by design and accepts the access-token
          cookie, so SameSite is the only defence its writes have against a
          cross-site form post. Use lax (the default) or strict.

  AlarmEmailAndTopicAreExclusive:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref AlarmEmail, '']
          - !Equals [!Ref AlarmTopicArn, '']
        AssertDescription: >-
          AlarmEmail and AlarmTopicArn both name where alarms go, so set exactly
          one. To have both, set AlarmTopicArn to your own topic and subscribe the
          address to it there — a topic you own is the one place a subscription
          list belongs.

  # A monitor with no subscriber is a monitor that detects anomalies and tells
  # nobody, and AWS refuses the subscription without one anyway; failing at the
  # changeset says so in a sentence instead of in a rollback.
  CostAnomalyDetectionNeedsANotificationTarget:
    RuleCondition: !Equals [!Ref EnableCostAnomalyDetection, 'true']
    Assertions:
      - Assert: !Not
          - !And
            - !Equals [!Ref AlarmEmail, '']
            - !Equals [!Ref AlarmTopicArn, '']
        AssertDescription: >-
          EnableCostAnomalyDetection is "true", so set AlarmEmail or AlarmTopicArn.
          A cost anomaly subscription requires a subscriber, and one that notified
          nothing would be a detector whose output nobody ever sees.

Resources:

  # ---------------------------------------------------------------------
  # Signing secrets
  #
  # Generated by Secrets Manager, never authored by a human, never a template
  # parameter, never in a CLI history. Created only when at least one of the
  # *SecretArn parameters is empty, which is the default; supply both ARNs and
  # the stack references yours instead and creates nothing.
  #
  # The function receives the ARN, not the value, and fetches the value itself
  # at cold start through internal/integration/aws (Secrets Manager -> SSM
  # SecureString -> environment variable, config-schema.md §1,
  # internal/config/secret.go resolveOne). One fetch per *secret* per execution
  # environment, cached for its life — never per request.
  #
  # This template used to do the opposite: '{{resolve:secretsmanager:...}}'
  # substitutes the VALUE into the environment at deploy time, and
  # `aws lambda get-function-configuration` then hands the HS256 key to anyone
  # holding lambda:GetFunction, who can mint a token for any user id. That is
  # why the substitution is gone from AuthFunction.Environment and why nothing
  # there may reintroduce it. The one use of the dynamic reference that remains
  # is inside JwtSigningSecrets below, secret-to-secret, where the resolved
  # value goes to Secrets Manager and nowhere a reader can follow — see the
  # note on it.
  #
  # No explicit Name: CloudFormation's deletion of a secret is a scheduled
  # deletion with a recovery window, and a fixed name would then block
  # re-creating the same stack for up to 30 days.
  #
  # ---- why two resources for one secret ------------------------------------
  #
  # The function must make ONE GetSecretValue on the init path, so both keys
  # have to live in one secret. GenerateSecretString populates exactly one key:
  # GenerateStringKey names it, and SecretStringTemplate supplies the rest of
  # the document as literal text. There is no second generator.
  #
  # So the second random value is generated by a second secret whose only job
  # is to hold it, and inlined into the first one's template with a
  # secret-to-secret dynamic reference. The two values are independent 64-char
  # strings drawn by AWS; neither is a function of the other. Deriving one from
  # the other — HMAC, hash, a suffix — was rejected: two keys that are a pure
  # function of each other are one key wearing two names, and RS-1's "must
  # differ" would be satisfied in letter only.
  #
  # What this costs, stated plainly:
  #   * Two Secrets Manager secrets are still billed, so cost at rest does not
  #     improve — only cold start does.
  #   * The refresh key exists in two places. JwtRefreshSecretSeed is NOT in
  #     the function's IAM policy and NOT in its environment, so the runtime
  #     blast radius is unchanged; the extra copy matters only to a principal
  #     with account-wide Secrets Manager read, who could read the real one
  #     anyway. Rotation (infra/sam/README.md) writes JwtSigningSecrets and
  #     leaves the seed stale, which is correct: after stack creation the seed
  #     is never read by anything at runtime.
  #   * The seed cannot be deleted by hand. CloudFormation re-resolves the
  #     dynamic reference whenever it builds a changeset for this stack, and a
  #     missing seed fails the changeset.
  #
  # Verified on a real deployment before it was written down: the resolved
  # value appears in neither template stage (Original or Processed) of
  # `cloudformation get-template`, nor in `describe-stack-events`.
  # ---------------------------------------------------------------------

  JwtRefreshSecretSeed:
    Type: AWS::SecretsManager::Secret
    Condition: GenerateSigningSecrets
    Properties:
      Description: !Sub 'Generated material for the refreshTokenSecret key of ${AWS::StackName} signing secrets — not read at runtime'
      GenerateSecretString:
        # ExcludePunctuation is load-bearing twice over here: it keeps the
        # value out of trouble in a JSON document (no quote or backslash to
        # escape) when it is inlined into JwtSigningSecrets below, and it is
        # what the previous bare-string secrets used. 64 characters of
        # alphanumeric against the 32 RS-1 requires.
        PasswordLength: 64
        ExcludePunctuation: true

  JwtSigningSecrets:
    Type: AWS::SecretsManager::Secret
    Condition: GenerateSigningSecrets
    Properties:
      Description: !Sub 'HS256 access- and refresh-token signing secrets for ${AWS::StackName} (two keys, one secret — RS-1 requires them to differ)'
      GenerateSecretString:
        # accessTokenSecret is drawn here. refreshTokenSecret is drawn by
        # JwtRefreshSecretSeed and copied in — the '${JwtRefreshSecretSeed}'
        # substitution is also what orders the two resources, so no DependsOn.
        #
        # The key names match the config paths they feed
        # (security.jwt.accessTokenSecret / .refreshTokenSecret), which is the
        # same convention the resolver's doc comment uses.
        SecretStringTemplate: !Sub '{"refreshTokenSecret":"{{resolve:secretsmanager:${JwtRefreshSecretSeed}}}"}'
        GenerateStringKey: accessTokenSecret
        PasswordLength: 64
        ExcludePunctuation: true

  # ---------------------------------------------------------------------
  # The IdP's signing key
  #
  # An asymmetric KMS key whose private half never leaves KMS. The function is
  # granted exactly two actions on exactly this key ARN — kms:Sign and
  # kms:GetPublicKey — and can do nothing else with it and nothing at all with
  # any other key in the account.
  #
  # ---- cost -------------------------------------------------------------
  # USD 1.00 per month for the key, plus USD 0.03 per 10,000 requests for an
  # RSA-2048 asymmetric operation — about USD 3.00 per million tokens signed.
  # kms:GetPublicKey is called once per execution environment (the public key is
  # memoised for the life of the process), so it rounds to nothing. Prices are
  # eu-west-1 at the time of writing and vary by region; the monthly dollar is
  # billed whether or not the key ever signs, which is why the key is created
  # only when EnableIdp is true.
  #
  # ---- what is NOT set, and why ----------------------------------------
  # * EnableKeyRotation: automatic rotation is a symmetric-key feature. AWS will
  #   not rotate an asymmetric key for you, and it should not: rotating a signing
  #   key changes the JWKS document every relying party caches, so it is a
  #   deliberate act — create a second key, list the old one in
  #   IdpPreviousKmsKeyArns (which sets idProvider.kmsPreviousKeyIds and grants
  #   the kms:GetPublicKey the JWKS document needs on it), point IdpKmsKeyId at
  #   the new one, and drop the old ARN once the last token it signed has
  #   expired. The kid is
  #   derived from the key material, so all of that is additive and no relying
  #   party sees a gap (deviations.md, idp-kid-derived-from-key-material).
  # * MultiRegion: a multi-region key would let a second stack in another region
  #   sign with the same identity. That is a real pattern and a decision with
  #   blast radius; it is not the quickstart's to make.
  # * DeletionPolicy: left at the default. Deleting a KMS key is a SCHEDULED
  #   deletion — PendingWindowInDays below — and it is cancellable for that whole
  #   window, which is the safety net a Retain would otherwise provide. Note that
  #   the key keeps costing its monthly dollar until the window closes.
  # ---------------------------------------------------------------------

  IdpSigningKey:
    Type: AWS::KMS::Key
    Condition: CreateIdpSigningKey
    Properties:
      Description: !Sub 'RS256 signing key for the ${AWS::StackName} identity provider'
      KeySpec: RSA_2048
      KeyUsage: SIGN_VERIFY
      # The shortest window AWS allows. A key nobody can sign with is a dead
      # identity provider, so a long window protects little; and the tokens it
      # signed are minutes old, not days.
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # The account's own administrative access. Written out rather than
          # left to the implicit default, because a key policy that does not
          # grant it can be made unmanageable by anyone: without this statement
          # IAM policies do not apply to the key at all, and a mistake in the
          # next one is unrecoverable.
          - Sid: EnableIAMPoliciesForThisAccount
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  IdpSigningKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreateIdpSigningKey
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-idp'
      TargetKeyId: !Ref IdpSigningKey

  # ---------------------------------------------------------------------
  # Single table — docs/spec/data-model.md §2
  #
  # PK/SK, one sparse GSI, and **no template change was needed for the admin
  # stores**: the key schema and the projection below already serve them.
  #
  # Six access patterns need GSI1 now. Four are per-owner fan-outs:
  # ListSessionsForUser (#15), DeleteRole's assignment sweep (#33),
  # GetTenantsForUser (#45) and LinkedAccountStore.ListForUser (#54). Two are
  # whole-entity enumerations added with core v0.8.0 — AdminUserStore.ListUsers
  # (#47) and SessionLister.GetAllSessions (#47b) — and they are served from a
  # *constant* GSI1 partition key rather than a per-owner one, because that is
  # the only shape in which a key-value store can enumerate. APIKeyAdminStore's
  # listing is the same shape (§1.5 #48). Every other lookup is served from the
  # main table's key space on purpose (§2.3).
  #
  # The consequence worth knowing before a deploy: GSI1 is sparse and the user
  # profile only started setting GSI1PK/GSI1SK with that release, so profiles
  # written earlier are invisible to ListUsers until a one-time backfill writes
  # the two attributes. That is a job (a paged sweep driven off _t = "user"),
  # not a template change; §1.4 and §7 rule 4 describe it. Sessions need no
  # backfill, because their directory entries expire with them.
  #
  # The GSI projection is INCLUDE of exactly _t, linkId, createdAt, matching
  # gsi1Projection in internal/store/dynamodb/table.go. Not ALL, because that
  # would duplicate every session item — the highest-churn entity — and not
  # KEYS_ONLY, because ListForUser needs a link's id and creation time. Nothing
  # secret is projected: passwordHash, totpSecret, refreshHash and every
  # *Hash/*Exp attribute exist in exactly one physical copy (§5).
  # ---------------------------------------------------------------------

  AuthTable:
    Type: AWS::DynamoDB::Table
    # DeletionPolicy is left at the default (Delete) so the quickstart can be
    # torn down cleanly. For a stack holding real users, change both of these
    # to Retain — they take no intrinsic functions, so it is a hand edit.
    # PITR does give you 35 days to restore a table deleted by accident.
    Properties:
      TableName: !Sub '${TableNamePrefix}-${AWS::StackName}'
      BillingMode: PAY_PER_REQUEST
      OnDemandThroughput:
        MaxReadRequestUnits: !Ref MaxReadRequestUnits
        MaxWriteRequestUnits: !Ref MaxWriteRequestUnits
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [_t, linkId, createdAt]
          OnDemandThroughput:
            MaxReadRequestUnits: !Ref MaxReadRequestUnits
            MaxWriteRequestUnits: !Ref MaxWriteRequestUnits
      TimeToLiveSpecification:
        # §4.5. Sessions, refresh pointers, all four single-use token pointers,
        # pending OAuth links, telemetry and rate-limit counters carry `ttl`.
        # TTL is not a security boundary — deletion is best-effort within ~48h
        # and every read re-checks the expiry attribute in code.
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        # §6.1: enabled from day one because turning it on later gives no
        # history. Nothing consumes it yet, and an unconsumed stream costs
        # nothing at rest.
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        # AWS-owned key. §6.1 recommends a customer-managed CMK for production;
        # it is left out of the quickstart because it adds a monthly key charge
        # and a real operational obligation (deleting the key destroys the data
        # irrecoverably, and PITR restore and S3 export both need kms:Decrypt).
        SSEEnabled: false
      DeletionProtectionEnabled: !Ref EnableDeletionProtection

  # ---------------------------------------------------------------------
  # HTTP API — payload format 2.0, not REST
  #
  # No CorsConfiguration here on purpose: the auth router applies CORS from
  # http.cors.origins, and configuring it in two places is how you end up with
  # duplicate Access-Control-Allow-Origin headers and a browser that rejects
  # both.
  # ---------------------------------------------------------------------

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      # The default stage is created automatically; don't also auto-deploy a
      # second one.
      FailOnWarnings: true

  # ---------------------------------------------------------------------
  # THE LOG GROUP CONVENTION — read this before adding a function
  # ---------------------------------------------------------------------
  #
  # **Every function this stack adds gets an explicit log group, named
  # /aws/lambda/<its FunctionName>, with RetentionInDays: !Ref LogRetentionDays,
  # and the function DependsOn it.** Three properties, all of them load-bearing:
  #
  #   * Explicit, because a log group Lambda creates for itself has NO EXPIRY AT
  #     ALL. That is not a default this template can change afterwards for a
  #     group CloudFormation does not own — and it is the one cost mistake in a
  #     serverless stack that compounds silently, because nothing about a
  #     never-expiring log group looks wrong until the storage line does.
  #   * Named exactly /aws/lambda/<FunctionName>, because that is the name Lambda
  #     itself would use. Get one character wrong and the deployment succeeds:
  #     CloudFormation creates a log group nothing writes to, Lambda creates the
  #     real one with no expiry, and the stack looks correct.
  #   * DependsOn, because it is a race. Without the ordering the function can be
  #     invoked — and therefore create its own group — before CloudFormation
  #     creates this one, and the create then fails with "log group already
  #     exists" or, worse, succeeds against a group whose retention was never set.
  #
  # This is a convention and not a mechanism, so it is ENFORCED BY A TEST:
  # infra/sam/template_test.go reads this file, finds every function in it, and
  # fails if any one of them lacks a matching log group, a retention that is
  # !Ref LogRetentionDays, or the DependsOn. A later block that adds the SSE
  # function, the webhook worker, the script runner or the migrate job gets a red
  # build rather than a bill nobody reads. That test is the reason this comment
  # can be a paragraph instead of a checklist somebody has to remember.
  AuthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-auth'
      RetentionInDays: !Ref LogRetentionDays

  AuthFunction:
    Type: AWS::Serverless::Function
    DependsOn: AuthLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-auth'
      Description: !Sub 'awesome-lambda-auth router for ${AWS::StackName}'
      # Built by scripts/build-lambda.sh. `aws cloudformation package` rewrites
      # this to an S3 URI; the path is relative to this template.
      CodeUri: ../../dist/auth-lambda.zip
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      # Empty means no reservation, and no reservation is the default. See the
      # parameter: this is the stack's only hard spend limit, and the reason it
      # is off is that past it real logins are refused exactly as a runaway is.
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrentExecutions, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          # --- deployment ------------------------------------------------
          AWESOME_AUTH_DEPLOYMENT_ENVIRONMENT: !Ref DeploymentEnvironment
          # Empty for a $default stage: the API is served at the root and there
          # is no stage segment for lambdahttp to strip.
          AWESOME_AUTH_DEPLOYMENT_STAGE: !If [IsDefaultStage, '', !Ref StageName]
          # Set only when the operator supplies one. It CANNOT be defaulted to
          # this stack's own execute-api URL, and the attempt is a circular
          # dependency, not a style preference:
          #
          #   AuthFunction.Environment -> !Ref HttpApi   (to build the URL)
          #   HttpApi.DefinitionBody   -> AuthFunction.Arn
          #     (SAM generates the OpenAPI body from the function's events, and
          #      every x-amazon-apigateway-integration uri names the function)
          #
          # CloudFormation rejects the changeset outright with
          #   Circular dependency between resources:
          #   [HttpApiStage, AuthFunctionRootPermission, HttpApi, AuthFunction,
          #    AuthFunctionProxyPermission]
          #
          # Nothing is lost. deployment.publicUrl has exactly one consumer,
          # refuse-to-start rule RS-2 (internal/config/rules.go
          # checkRS2InsecureCookieMode), which asks whether the origin is a
          # custom domain or a shared AWS one. On a raw execute-api URL the
          # answer is "shared", so the only way to pass RS-2 there is
          # AllowInsecureCookieMode=true, which short-circuits the rule before
          # it ever reads this value. The deployment where the value decides
          # anything is the custom-domain one — and that deployment sets
          # PublicUrl by definition. The endpoint is still reported, in the
          # ApiEndpoint output; an output may reference HttpApi freely because
          # outputs are resolved after every resource exists.
          AWESOME_AUTH_DEPLOYMENT_PUBLIC_URL: !If [HasPublicUrl, !Ref PublicUrl, !Ref 'AWS::NoValue']

          # --- store -----------------------------------------------------
          AWESOME_AUTH_STORES_DRIVER: dynamodb
          AWESOME_AUTH_STORES_CONNECTION_TABLE_NAME: !Ref AuthTable

          # --- http ------------------------------------------------------
          AWESOME_AUTH_HTTP_API_PREFIX: !Ref ApiPrefix
          AWESOME_AUTH_CORS_ORIGINS: !If [HasAllowedOrigins, !Ref AllowedOrigins, !Ref 'AWS::NoValue']

          # --- cookies and CSRF ------------------------------------------
          # Secure is unconditionally true: API Gateway only ever serves HTTPS.
          AWESOME_AUTH_COOKIES_SECURE: 'true'
          AWESOME_AUTH_COOKIES_SAMESITE: !Ref CookieSameSite
          AWESOME_AUTH_COOKIES_DOMAIN: !If [HasCookieDomain, !Ref CookieDomain, !Ref 'AWS::NoValue']
          AWESOME_AUTH_COOKIES_REFRESH_PATH: !If
            - NeedsStagePrefixedCookiePath
            - !Sub '/${StageName}${ApiPrefix}/refresh'
            - !Ref 'AWS::NoValue'
          AWESOME_AUTH_COOKIES_ALLOW_INSECURE_COOKIE_MODE: !Ref AllowInsecureCookieMode
          # RS-3: cookie delivery without a double-submit token is cross-site
          # forgeable. Left explicit so a reader sees it is on.
          AWESOME_AUTH_CSRF_ENABLED: 'true'

          # --- sessions --------------------------------------------------
          AWESOME_AUTH_SESSIONS_CHECK_ON: !Ref SessionCheckOn

          # --- credential delivery ---------------------------------------
          # Set as a group or not at all: internal/config refuses a mailer
          # block that has a from address and no endpoint, and refuses one that
          # has an endpoint and no from address.
          #
          # The endpoint below is a placeholder and is never contacted. SES is
          # reached through the AWS API, so there is nothing to point it at; it
          # exists because config-schema.md §1.5 marks it required, and the
          # function reports it as an unhonoured knob in the cold-start log so
          # that nobody has to work that out from behaviour. Do NOT set it to a
          # real mail gateway expecting traffic — none is sent.
          #
          # No AWESOME_AUTH_MAILER_API_KEY, and no reference to one: SES
          # authorises the send with the execution role, so there is no key to
          # store, rotate or leak.
          AWESOME_AUTH_MAILER_ENDPOINT: !If [HasMailer, 'https://ses.invalid/unused-see-template-comment', !Ref 'AWS::NoValue']
          AWESOME_AUTH_MAILER_FROM: !If [HasMailer, !Ref MailerFromAddress, !Ref 'AWS::NoValue']
          AWESOME_AUTH_MAILER_FROM_NAME: !If [HasMailerFromName, !Ref MailerFromName, !Ref 'AWS::NoValue']
          AWESOME_AUTH_MAILER_DEFAULT_LANG: !If [HasMailer, !Ref MailerDefaultLang, !Ref 'AWS::NoValue']
          AWESOME_AUTH_MAILER_PROVIDER: !If [HasMailer, 'ses', !Ref 'AWS::NoValue']

          # The sms block has no AWS-shaped knob at all — every key in it
          # describes the reference's HTTP gateway — so its required endpoint is
          # what says "wire SMS delivery", and it is likewise a placeholder that
          # is never contacted. sms.apiKey, sms.username and sms.password are
          # deliberately absent: SNS authorises the publish with the execution
          # role, which retires the credentials-in-URL hazard config-schema.md
          # §1.6 records for them along with the credentials themselves.
          AWESOME_AUTH_SMS_ENDPOINT: !If [SmsEnabled, 'https://sns.invalid/unused-see-template-comment', !Ref 'AWS::NoValue']

          # --- email flows -----------------------------------------------
          AWESOME_AUTH_EMAIL_SITE_URLS: !If [HasEmailSiteUrls, !Ref EmailSiteUrls, !Ref 'AWS::NoValue']
          AWESOME_AUTH_EMAIL_DELIVERY_WEBHOOK_URL: !If [HasDeliveryWebhook, !Ref EmailDeliveryWebhookUrl, !Ref 'AWS::NoValue']
          # A REFERENCE, like the signing secrets below and for the same reason:
          # the _SECRETSMANAGER suffix means "this names a Secrets Manager
          # secret" and the function fetches the value itself at cold start. The
          # bare AWESOME_AUTH_EMAIL_DELIVERY_WEBHOOK_SECRET, which holds the key
          # in plaintext, is development-only and deliberately not set here.
          AWESOME_AUTH_EMAIL_DELIVERY_WEBHOOK_SECRET_SECRETSMANAGER: !If
            - HasDeliveryWebhookSecret
            - !Ref EmailDeliveryWebhookSecretArn
            - !Ref 'AWS::NoValue'

          # --- second factor and token claims ----------------------------
          # The issuer is unconditional: every stack mounts /2fa/setup, the
          # binary always passes the value, and an empty one is refused at
          # start. The webhook knobs follow the delivery webhook exactly —
          # a url that switches it on, a timeout, and a SECRETSMANAGER
          # reference whose value the function fetches at cold start.
          AWESOME_AUTH_2FA_APP_NAME: !Ref TotpIssuer
          AWESOME_AUTH_JWT_CLAIMS_WEBHOOK_URL: !If [HasClaimsWebhook, !Ref ClaimsWebhookUrl, !Ref 'AWS::NoValue']
          # !Sub rather than !Ref: a Lambda environment variable is a string,
          # and the parameter is a Number so that CloudFormation enforces the
          # range before the stack is touched.
          AWESOME_AUTH_JWT_CLAIMS_WEBHOOK_TIMEOUT_MS: !If
            - HasClaimsWebhook
            - !Sub '${ClaimsWebhookTimeoutMs}'
            - !Ref 'AWS::NoValue'
          AWESOME_AUTH_JWT_CLAIMS_WEBHOOK_SECRET_SECRETSMANAGER: !If
            - HasClaimsWebhookSecret
            - !Ref ClaimsWebhookSecretArn
            - !Ref 'AWS::NoValue'

          # --- OAuth providers -------------------------------------------
          # Three variables per provider, set as a group or not at all: the
          # client id, the callback URL derived from the origin this deployment
          # is reached at, and a REFERENCE to the client secret (never the
          # secret). The Rules section refuses a client id without PublicUrl, so
          # the !Sub below always has an origin to build on.
          #
          # The callback URL must be byte-identical to the one registered with
          # the provider, which is why it is derived here and not typed: the
          # provider checks redirect_uri against its own registration, and the
          # function sends the value of this variable. PublicUrl and ApiPrefix
          # both carry AllowedPatterns that forbid a trailing slash, so the two
          # !Subs below can only ever produce one slash before "oauth".
          #
          # The linked-accounts store is switched on with them, and it is not
          # optional: it is where the callback binds a provider identity to an
          # account, and with it off the core answers the callback 501 after the
          # person has already consented. RS-11 refuses that combination at cold
          # start, so this line is what keeps a provider-configured stack
          # startable — it is set here rather than left to the operator because
          # the store is a consequence of configuring a provider, not a separate
          # decision. stores.enable.pendingLinks is a separate decision and stays
          # document-only: it buys the single-use state nonce, and RS-11 requires
          # it only for oauth.provisioning.onEmailMatch: conflict.
          AWESOME_AUTH_STORES_ENABLE_LINKED_ACCOUNTS: !If [HasAnyOAuthProvider, 'true', !Ref 'AWS::NoValue']
          AWESOME_AUTH_OAUTH_GOOGLE_CLIENT_ID: !If [HasOAuthGoogle, !Ref OAuthGoogleClientId, !Ref 'AWS::NoValue']
          AWESOME_AUTH_OAUTH_GOOGLE_CALLBACK_URL: !If
            - HasOAuthGoogle
            - !Sub '${PublicUrl}${ApiPrefix}/oauth/google/callback'
            - !Ref 'AWS::NoValue'
          AWESOME_AUTH_OAUTH_GOOGLE_CLIENT_SECRET_SECRETSMANAGER: !If
            - HasOAuthGoogle
            - !Ref OAuthGoogleClientSecretArn
            - !Ref 'AWS::NoValue'
          AWESOME_AUTH_OAUTH_GITHUB_CLIENT_ID: !If [HasOAuthGithub, !Ref OAuthGithubClientId, !Ref 'AWS::NoValue']
          AWESOME_AUTH_OAUTH_GITHUB_CALLBACK_URL: !If
            - HasOAuthGithub
            - !Sub '${PublicUrl}${ApiPrefix}/oauth/github/callback'
            - !Ref 'AWS::NoValue'
          AWESOME_AUTH_OAUTH_GITHUB_CLIENT_SECRET_SECRETSMANAGER: !If
            - HasOAuthGithub
            - !Ref OAuthGithubClientSecretArn
            - !Ref 'AWS::NoValue'

          # --- identity provider -----------------------------------------
          # The key id is an ARN — the stack's own key, or the one the operator
          # brought — and it is not a secret: it names a key nobody can export,
          # which is the whole reason it is preferable to a PEM in the
          # environment. AWESOME_AUTH_IDP_PRIVATE_KEY is deliberately absent;
          # RS-4 refuses a deployment that sets both.
          AWESOME_AUTH_IDP_ENABLED: !Ref EnableIdp
          AWESOME_AUTH_IDP_KMS_KEY_ID: !If
            - IdpEnabled
            - !If [CreateIdpSigningKey, !GetAtt IdpSigningKey.Arn, !Ref IdpKmsKeyId]
            - !Ref 'AWS::NoValue'
          # The retired keys, comma-separated, exactly as the config layer's list
          # binding reads them. Each one is a kms:GetPublicKey at cold start, and
          # the IAM statement below grants that read on these same ARNs — the two
          # come from one parameter so a rotation cannot be half-configured.
          AWESOME_AUTH_IDP_KMS_PREVIOUS_KEY_IDS: !If
            - RotatingIdpKeys
            - !Join [',', !Ref IdpPreviousKmsKeyArns]
            - !Ref 'AWS::NoValue'
          AWESOME_AUTH_IDP_ISSUER: !If [HasIdpIssuer, !Ref IdpIssuer, !Ref 'AWS::NoValue']
          # Absent unless moved, so the core's own default path stands and a
          # jwksPath set in ConfigFile is not overridden by an environment
          # variable the operator never set.
          AWESOME_AUTH_IDP_JWKS_PATH: !If [HasIdpJwksPath, !Ref IdpJwksPath, !Ref 'AWS::NoValue']

          # --- resource server -------------------------------------------
          AWESOME_AUTH_RS_ENABLED: !Ref EnableResourceServer
          AWESOME_AUTH_RS_JWKS_URL: !If [ResourceServerEnabled, !Ref ResourceServerJwksUrl, !Ref 'AWS::NoValue']
          AWESOME_AUTH_RS_ISSUER: !If [HasResourceServerIssuer, !Ref ResourceServerIssuer, !Ref 'AWS::NoValue']

          # --- migration from Amazon Cognito -----------------------------
          # The source is derived from the pool id rather than being a parameter
          # of its own: "cognito" is the only value this build knows, and an
          # operator who had to set two knobs to mean one thing would eventually
          # set one of them. Every variable here is absent while the pool id is
          # empty, so an unconfigured stack loads the same configuration it
          # loaded before this block existed.
          AWESOME_AUTH_STORES_MIGRATION_SOURCE: !If [MigratingFromCognito, 'cognito', !Ref 'AWS::NoValue']
          AWESOME_AUTH_STORES_MIGRATION_USER_POOL_ID: !If [MigratingFromCognito, !Ref CognitoUserPoolId, !Ref 'AWS::NoValue']
          AWESOME_AUTH_STORES_MIGRATION_REGION: !If [MigratingFromCognito, !Ref CognitoRegion, !Ref 'AWS::NoValue']
          AWESOME_AUTH_STORES_MIGRATION_CLIENT_ID: !If [HasCognitoAppClient, !Ref CognitoAppClientId, !Ref 'AWS::NoValue']
          AWESOME_AUTH_STORES_MIGRATION_MODE: !If [MigratingFromCognito, !Ref CognitoMigrationMode, !Ref 'AWS::NoValue']

          # --- admin console ---------------------------------------------
          # Every variable here is absent while EnableAdminConsole is
          # "false" -- the root user's pair through HasAdminRootPasswordHash,
          # whose first term is the switch -- so an unconfigured stack loads
          # the configuration it loaded before this block existed and reads
          # no secret for a console it does not mount. The root user's hash
          # is a REFERENCE with the _SECRETSMANAGER suffix, like the signing
          # secrets: the function fetches the value at cold start and the
          # bcrypt hash never enters the template or the environment.
          #
          # The console's JWT secret is deliberately NOT a variable: the
          # binary leaves AdminOptions.JWTSecret empty so the core verifies
          # admin sessions with security.jwt.accessTokenSecret, which is the
          # integration the reference documents and the reason an ordinary
          # login also opens the console (config-reference.md §16).
          AWESOME_AUTH_ADMIN_ENABLED: !If [AdminConsoleEnabled, 'true', !Ref 'AWS::NoValue']
          AWESOME_AUTH_ADMIN_ACCESS_POLICY: !If [AdminConsoleEnabled, !Ref AdminAccessPolicy, !Ref 'AWS::NoValue']
          AWESOME_AUTH_ADMIN_ROOT_EMAIL: !If
            - HasAdminRootPasswordHash
            - !Ref AdminRootEmail
            - !Ref 'AWS::NoValue'
          AWESOME_AUTH_ADMIN_ROOT_PASSWORD_HASH_SECRETSMANAGER: !If
            - HasAdminRootPasswordHash
            - !Ref AdminRootPasswordHashArn
            - !Ref 'AWS::NoValue'
          # The upload location, as the S3 form ui.uploadDir takes on this
          # product: the bucket this stack owns, under one prefix, so the
          # IAM statement below can be scoped to that prefix and nothing
          # else in the bucket. Present whenever the bucket is, console or
          # not, because it is also where the hosted UI serves uploaded
          # logos from.
          AWESOME_AUTH_UI_UPLOAD_DIR: !If
            - AdminUploadsEnabled
            - !Sub 's3://${AdminUploadsBucket}/uploads'
            - !Ref 'AWS::NoValue'

          # --- configuration document ------------------------------------
          # A path inside the artifact, never a value: the document is part of
          # the reproducible zip, so what the function reads is what was built.
          AWESOME_AUTH_CONFIG_FILE: !If [HasConfigFile, !Ref ConfigFile, !Ref 'AWS::NoValue']

          # --- signing secrets -------------------------------------------
          # REFERENCES, not values. The _SECRETSMANAGER suffix on a secret
          # knob's documented variable means "this names a Secrets Manager
          # secret" (internal/config/secret.go, SecretsManagerEnvSuffix); the
          # function fetches the value itself at cold start.
          #
          # Everything readable here is an ARN. Anyone with lambda:GetFunction
          # learns where the key lives, which they could learn from the stack
          # anyway, and still cannot sign a token. Reading the key itself needs
          # secretsmanager:GetSecretValue on that exact ARN.
          #
          # Do not add AWESOME_AUTH_JWT_ACCESS_SECRET (no suffix) alongside
          # these. It is the plaintext form, it is development-only, and it is
          # last in the resolution order — so it would not even take effect,
          # while still publishing the secret.
          #
          # By default both point at the SAME secret ARN with different
          # '#<jsonKey>' selectors. That is the whole cold-start change: the
          # resolver caches per secret id with the selector stripped
          # (internal/integration/aws/secrets.go splitSecretRef, secretCache),
          # so the second knob is served from the first knob's fetch and init
          # makes one GetSecretValue instead of two. Bring your own ARN and
          # that knob points at yours; the selector is optional there too.
          AWESOME_AUTH_JWT_ACCESS_SECRET_SECRETSMANAGER: !If
            - GenerateJwtAccessSecret
            - !Sub '${JwtSigningSecrets}#accessTokenSecret'
            - !Ref JwtAccessSecretArn
          AWESOME_AUTH_JWT_REFRESH_SECRET_SECRETSMANAGER: !If
            - GenerateJwtRefreshSecret
            - !Sub '${JwtSigningSecrets}#refreshTokenSecret'
            - !Ref JwtRefreshSecretArn

      Policies:
        # -----------------------------------------------------------------
        # Exactly the calls the store makes, and nothing else. The list is the
        # API interface in internal/store/dynamodb/store.go, cross-checked
        # against the call sites: GetItem, PutItem, UpdateItem, DeleteItem,
        # Query, TransactWriteItems, BatchGetItem, BatchWriteItem.
        #
        #   * TransactWriteItems has no IAM action of its own — it is
        #     authorised by the per-item actions of the operations inside it.
        #   * No ConditionCheckItem. Nothing in the P1 subset puts a bare
        #     ConditionCheck into a transaction; a Put or Update carrying a
        #     ConditionExpression is authorised by PutItem/UpdateItem. It goes
        #     back in with the RBAC and tenant stores, which do use one
        #     (data-model.md #29 and #43). Granting it early would make the
        #     first line of this comment false, which is the whole point.
        #   * No Scan: the store never scans. No DescribeTable: New() performs
        #     no I/O, deliberately, so a cold start does not pay for one.
        #   * No CreateTable/UpdateTimeToLive: the helper in table.go exists for
        #     DynamoDB Local and throwaway tables. Production tables come from
        #     this template.
        #   * Index ARNs only accept read actions, and the store only ever
        #     Queries GSI1.
        #
        # If you copy one thing out of this template, copy this. A wildcard
        # resource in an auth service's execution role is a bad example that
        # propagates.
        # -----------------------------------------------------------------
        - Version: '2012-10-17'
          Statement:
            - Sid: AuthTableItems
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
              Resource: !GetAtt AuthTable.Arn
            - Sid: AuthTableIndexQuery
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub '${AuthTable.Arn}/index/GSI1'

        # -----------------------------------------------------------------
        # The signing secrets the function actually reads, by ARN, and nothing
        # else. One action, no wildcard — not even the ':*' suffix AWS
        # documentation habitually appends, because a full ARN including the
        # six-character suffix Secrets Manager generates is an exact match and
        # a wildcard would also match every future secret whose name shares the
        # prefix.
        #
        # On the default path that is ONE resource: both knobs read two keys of
        # JwtSigningSecrets. JwtRefreshSecretSeed is deliberately absent — it is
        # consumed by CloudFormation at stack-create time and never by the
        # function, so granting the role a read on it would widen the runtime
        # blast radius for nothing.
        #
        # !Select/!Split strips an optional '#<jsonKey>' selector from a
        # supplied ARN: the resolver understands the suffix, IAM does not, and
        # a Resource with a '#' in it silently matches nothing. The generated
        # ARNs are listed without a selector for the same reason.
        #
        # No kms:Decrypt: these secrets use the AWS-managed aws/secretsmanager
        # key, which needs no grant on the caller. A customer-managed key does
        # — add kms:Decrypt on that key's ARN, scoped with a
        # kms:ViaService condition.
        #
        # No ssm:GetParameter either. The SSM resolver is wired in the binary
        # and this stack does not use it; granting a permission nothing calls
        # would make the DynamoDB comment above a lie. If you point a knob at a
        # SecureString with AWESOME_AUTH_<KNOB>_SSM_PARAMETER, add:
        #
        #   - Effect: Allow
        #     Action: [ssm:GetParameter]
        #     Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/your/parameter'
        #
        # plus kms:Decrypt on the key it was encrypted with, unless that is the
        # AWS-managed aws/ssm key.
        # -----------------------------------------------------------------
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadSigningSecrets
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !If [GenerateSigningSecrets, !Ref JwtSigningSecrets, !Ref 'AWS::NoValue']
                - !If [GenerateJwtAccessSecret, !Ref 'AWS::NoValue', !Select [0, !Split ['#', !Ref JwtAccessSecretArn]]]
                - !If [GenerateJwtRefreshSecret, !Ref 'AWS::NoValue', !Select [0, !Split ['#', !Ref JwtRefreshSecretArn]]]

        # -----------------------------------------------------------------
        # The delivery webhook's signing key, present only when one was named
        # and scoped to that one ARN — the '#<jsonKey>' selector stripped,
        # because the selector is the function's and the resource is the
        # secret. A separate statement rather than a fourth entry above so
        # that a stack with no webhook grants nothing for it.
        # -----------------------------------------------------------------
        - !If
          - HasDeliveryWebhookSecret
          - Version: '2012-10-17'
            Statement:
              - Sid: ReadDeliveryWebhookSigningSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Select [0, !Split ['#', !Ref EmailDeliveryWebhookSecretArn]]
          - !Ref 'AWS::NoValue'

        # -----------------------------------------------------------------
        # The claims webhook's signing key, on exactly the same terms as the
        # delivery webhook's above: its own statement, present only when an ARN
        # was named, scoped to that one secret with the '#<jsonKey>' selector
        # stripped because the selector is the function's and the resource is
        # the secret. Two statements rather than one with two resources, so
        # that a stack with one webhook grants nothing for the other.
        # -----------------------------------------------------------------
        - !If
          - HasClaimsWebhookSecret
          - Version: '2012-10-17'
            Statement:
              - Sid: ReadClaimsWebhookSigningSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Select [0, !Split ['#', !Ref ClaimsWebhookSecretArn]]
          - !Ref 'AWS::NoValue'

        # -----------------------------------------------------------------
        # The OAuth client secrets, one ARN per configured provider and nothing
        # else — the '#<jsonKey>' selector stripped, because the selector is the
        # function's and the resource is the secret. A stack with one provider
        # grants one read; a stack with none grants nothing at all, which is why
        # this is a separate statement rather than two more entries on the
        # signing-secret one.
        # -----------------------------------------------------------------
        - !If
          - HasAnyOAuthProvider
          - Version: '2012-10-17'
            Statement:
              - Sid: ReadOAuthClientSecrets
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !If [HasOAuthGoogle, !Select [0, !Split ['#', !Ref OAuthGoogleClientSecretArn]], !Ref 'AWS::NoValue']
                  - !If [HasOAuthGithub, !Select [0, !Split ['#', !Ref OAuthGithubClientSecretArn]], !Ref 'AWS::NoValue']
          - !Ref 'AWS::NoValue'

        # -----------------------------------------------------------------
        # Credential delivery. Two statements, each present only when its half
        # is configured, and each as narrow as its service allows.
        #
        # ---- mail --------------------------------------------------------
        # One action. SES v2's SendEmail is authorised by `ses:SendEmail` — the
        # v2 API kept the v1 IAM prefix — and the resource is the identity being
        # sent *from*, which is the only ARN in play: a recipient is not an AWS
        # resource and cannot be scoped. Scoped to one identity, this role can
        # send as no-reply@yourdomain and as nothing else in the account.
        #
        # MailerIdentity defaults to the domain of MailerFromAddress, since a
        # verified domain covers every address under it. When the verified
        # identity is the single address rather than the domain, set
        # MailerIdentity to that address or SES denies the send — the identity
        # ARN has to name what was actually verified.
        #
        # No ses:SendRawEmail (the transport sends simple content only), no
        # ses:SendTemplatedEmail (templates are rendered in-process, by the
        # imported core), no ses:GetAccount or ses:ListIdentities: nothing reads
        # SES configuration at runtime, and a role that can enumerate a verified
        # domain list is a role that can help someone map the account.
        #
        # ---- SMS ---------------------------------------------------------
        # NotResource, and it is not a wildcard in disguise. sns:Publish to a
        # phone number has no resource ARN — the destination is a phone number,
        # which AWS does not model as a resource — so `Resource: '*'` is the
        # only Resource form that grants it, and that same statement would also
        # let this role publish to every SNS topic in the account. The
        # documented way to grant one without the other is to allow the action
        # against everything that is NOT an SNS ARN, which is exactly this: SMS
        # to a handset is permitted, publishing to any topic — including a
        # topic feeding a Lambda, a queue or a webhook — is not.
        #
        # No sns:SetSMSAttributes and no sns:SetSMSAttributes-adjacent action:
        # the transport sets AWS.SNS.SMS.SMSType per message, which needs no
        # permission, and changing the account's SMS defaults is a deployment
        # decision rather than something an auth router should be able to do.
        # -----------------------------------------------------------------
        - !If
          - HasMailer
          - Version: '2012-10-17'
            Statement:
              - Sid: SendAuthMailFromTheVerifiedIdentity
                Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: !Sub
                  - 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${Identity}'
                  - Identity: !If
                      - HasExplicitMailerIdentity
                      - !Ref MailerIdentity
                      - !Select [1, !Split ['@', !Ref MailerFromAddress]]
          - !Ref 'AWS::NoValue'

        - !If
          - SmsEnabled
          - Version: '2012-10-17'
            Statement:
              - Sid: PublishSmsToHandsetsOnly
                Effect: Allow
                Action:
                  - sns:Publish
                NotResource: !Sub 'arn:${AWS::Partition}:sns:*:*:*'
          - !Ref 'AWS::NoValue'

        # -----------------------------------------------------------------
        # The IdP's signing key. Two actions on the current key, and nothing
        # else in the account except a read on the keys being retired.
        #
        #   * kms:Sign produces the RS256 signature of every token the IdP
        #     issues. The request carries the 32-byte SHA-256 of the token's
        #     signing input and nothing else (MessageType: DIGEST), so the
        #     claims never reach the service.
        #   * kms:GetPublicKey is what the JWKS document is built from, once per
        #     execution environment.
        #
        # The second statement is the rotation, and it exists because the first
        # one cannot carry it: KMSSigner.JWKS calls GetPublicKey for every id in
        # idProvider.kmsPreviousKeyIds at cold start, so a retired ARN the policy
        # does not cover fails the init rather than one request. It grants
        # GetPublicKey and NOT Sign: a key that has been retired must not be able
        # to mint anything, and the JWKS document is the only thing it is still
        # there for. It is absent entirely while IdpPreviousKmsKeyArns is empty.
        #
        # No kms:CreateKey, no kms:ScheduleKeyDeletion, no kms:PutKeyPolicy: an
        # auth router that can delete its own signing key, or grant a third
        # party the use of it, is a bad example that propagates. No kms:Decrypt
        # or kms:Encrypt either — this key's usage is SIGN_VERIFY and those
        # actions would be refused anyway, so granting them would say something
        # untrue about what the function does.
        #
        # A KEY ARN and not an alias ARN, for both halves of IdpKmsKeyId: IAM
        # evaluates kms actions against the key's own ARN, and a statement whose
        # Resource is an alias matches nothing at all — a failure that shows up
        # as AccessDeniedException on the first token, long after the deploy
        # that looked successful.
        # -----------------------------------------------------------------
        - !If
          - IdpEnabled
          - Version: '2012-10-17'
            Statement:
              - Sid: SignWithTheIdentityProviderKey
                Effect: Allow
                Action:
                  - kms:Sign
                  - kms:GetPublicKey
                Resource: !If [CreateIdpSigningKey, !GetAtt IdpSigningKey.Arn, !Ref IdpKmsKeyId]
          - !Ref 'AWS::NoValue'

        - !If
          - RotatingIdpKeys
          - Version: '2012-10-17'
            Statement:
              - Sid: ReadTheRetiredIdentityProviderKeys
                Effect: Allow
                Action:
                  - kms:GetPublicKey
                Resource: !Ref IdpPreviousKmsKeyArns
          - !Ref 'AWS::NoValue'

        # -----------------------------------------------------------------
        # The migration source: three actions on ONE user pool, and nothing
        # else anywhere in Cognito.
        #
        # The Resource is built from the pool id rather than taken as an ARN
        # parameter, so the statement cannot be widened by pasting a wildcard
        # into it — and the account and region come from the parameters, because
        # the pool being migrated away from is commonly in neither this stack's
        # account nor its region.
        #
        # What is NOT granted, and why each absence is deliberate:
        #
        #   * No AdminCreateUser, AdminSetUserPassword, AdminUpdateUserAttributes,
        #     AdminDeleteUser. The migration is one-way and read-only at the
        #     source. An auth router that can rewrite the directory it is leaving
        #     can undo the migration it just performed, and a role that could
        #     delete users in the old system is a role nobody will grant.
        #   * No AdminRespondToAuthChallenge. AdminInitiateAuth can come back with
        #     a challenge — SMS_MFA, NEW_PASSWORD_REQUIRED — and this product
        #     deliberately treats one as "not the password" rather than answering
        #     it (internal/integration/aws/cognito.go, VerifyPassword). Without
        #     the permission, that decision cannot be quietly reversed by a code
        #     change alone.
        #   * No cognito-idp:* on the pool's app clients, resource servers or
        #     identity providers. Nothing here administers the pool.
        #   * No cognito-identity:* at all. Identity pools are a different service
        #     and this product does not use them.
        #
        # ListUsers is granted to the FUNCTION even though only `migrate cognito`
        # calls it. That is a deliberate, small widening, and the alternative is
        # worse: a second role, or a human's own credentials, holding admin read
        # over a directory of users. One role, three actions, one pool, and the
        # operator command assumes it.
        #
        # The whole statement is absent while CognitoUserPoolId is empty, which
        # is the default. An empty parameter adds no policy and no cost.
        # -----------------------------------------------------------------
        - !If
          - MigratingFromCognito
          - Version: '2012-10-17'
            Statement:
              - Sid: ReadTheMigrationSourceUserPool
                Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminInitiateAuth
                Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${CognitoRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
          - !Ref 'AWS::NoValue'

        # -----------------------------------------------------------------
        # The root administrator's password hash, on the same terms as the
        # webhook signing keys: its own statement, present only when an ARN
        # was named beside an email, scoped to that one secret with the
        # '#<jsonKey>' selector stripped.
        # -----------------------------------------------------------------
        - !If
          - HasAdminRootPasswordHash
          - Version: '2012-10-17'
            Statement:
              - Sid: ReadAdminRootPasswordHash
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Select [0, !Split ['#', !Ref AdminRootPasswordHashArn]]
          - !Ref 'AWS::NoValue'

        # -----------------------------------------------------------------
        # The upload bucket: exactly the calls the store makes, on exactly
        # the prefix it writes under. The list is the S3API interface in
        # internal/integration/aws/s3_uploads.go — PutObject, GetObject,
        # HeadObject, DeleteObject, ListObjectsV2 — and HeadObject is
        # authorised by s3:GetObject, ListObjectsV2 by s3:ListBucket.
        #
        # Two statements because IAM scopes them to two different ARNs: the
        # object actions to the objects under uploads/, the listing to the
        # bucket itself. The listing grant carries NO s3:prefix condition,
        # and that is load-bearing for the 404s rather than a loosening: S3
        # answers a GetObject or HeadObject for an absent key with 404 only
        # to a caller that holds s3:ListBucket for that request, and with
        # 403 AccessDenied otherwise, so that the absence of a key is not
        # disclosed to somebody who may not enumerate them. A GetObject
        # request carries no s3:prefix context key, so a listing grant
        # conditioned on one does not apply to it, and every missing logo
        # and every delete of an absent file would come back 403 -- which
        # the store deliberately reads as the failure it is and never as
        # "not found" (s3_uploads.go isS3NotFound,
        # TestS3AccessDeniedIsAFailureNotAMiss), so the hosted UI would
        # answer 500 where the reference answers 404. The bucket is
        # stack-owned and holds nothing but this prefix, so listing it whole
        # discloses nothing the prefix would not. No s3:PutObjectAcl, no
        # s3:DeleteBucket, no s3:PutBucketPolicy: an auth router that can
        # make its own bucket public is a bad example that propagates.
        #
        # Absent entirely while EnableAdminUploads is "false". An empty
        # parameter adds no statement and no cost.
        # -----------------------------------------------------------------
        - !If
          - AdminUploadsEnabled
          - Version: '2012-10-17'
            Statement:
              - Sid: AdminUploadObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${AdminUploadsBucket.Arn}/uploads/*'
              - Sid: AdminUploadListing
                Effect: Allow
                Action:
                  - s3:ListBucket
                # Unconditioned on purpose; see the comment above.
                Resource: !GetAtt AdminUploadsBucket.Arn
          - !Ref 'AWS::NoValue'

      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
            PayloadFormatVersion: '2.0'
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: '2.0'

  # ---------------------------------------------------------------------
  # Admin uploads
  #
  # One private bucket for the logos and background images the console
  # uploads, and that the hosted UI serves back under <ApiPrefix>/ui/assets.
  # Created only when EnableAdminUploads is "true"; with it "false" there is
  # no bucket, no IAM statement and no variable, and the console's upload tab
  # is off — which is the reference's own behaviour with uploadDir unset.
  #
  # Private in every sense the service has: every public-access block set,
  # ACLs disabled outright (BucketOwnerEnforced, so no object can be made
  # public by an ACL even by a principal with PutObjectAcl), and encrypted at
  # rest with SSE-S3, which costs nothing and needs no key to manage. The
  # objects are served to browsers by the FUNCTION, through the store, not by
  # S3 — there is no website configuration and no public read, so a logo is
  # reachable at <ApiPrefix>/ui/assets/uploads/<name> and nowhere else.
  #
  # No explicit BucketName: a fixed name would collide with a bucket left
  # behind by a previous stack of the same name, and the generated one is
  # reported in the AdminUploadsBucketName output. DeletionPolicy is left at
  # the default so the quickstart tears down cleanly; a bucket that is not
  # empty fails the delete, which is CloudFormation's own protection against
  # losing uploads, and `scripts/teardown.sh` says so.
  #
  # No lifecycle rule and no versioning. The objects are a handful of images
  # replaced by an administrator on purpose; versioning would keep every
  # replaced logo forever and bill for it, and there is nothing to expire.
  # ---------------------------------------------------------------------

  AdminUploadsBucket:
    Type: AWS::S3::Bucket
    Condition: AdminUploadsEnabled
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: awesome-lambda-auth
          Value: admin-uploads

  # The one bucket policy, and it grants nothing: it refuses every request
  # that did not arrive over TLS, for every principal, the function's role
  # included. The SDK the store uses speaks https and never trips it; what it
  # closes is an operator's `aws s3 --endpoint-url http://` or a future
  # reader configured carelessly, and it costs nothing. BlockPublicPolicy
  # above still applies: a Deny statement is not a public grant.
  AdminUploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: AdminUploadsEnabled
    Properties:
      Bucket: !Ref AdminUploadsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AdminUploadsBucket.Arn
              - !Sub '${AdminUploadsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------------------
  # Content delivery
  #
  # One distribution, one origin — this stack's own HTTP API — and no caching
  # at all. Created only when EnableCloudFront is "true"; with it "false" every
  # resource in this region is conditioned away and the stack costs what it
  # cost before.
  #
  # ---- what it is for, since it is not for caching -------------------------
  #
  # The hosted UI is served by the function, from assets compiled into the
  # binary, at <ApiPrefix>/ui. So the login page and the routes it posts to are
  # already the same origin, and "UI embedded same-origin" needs no distribution
  # to be true. What a distribution adds is a hostname in front of that origin
  # that is not execute-api.amazonaws.com — and that is the whole of the
  # KNOWN LIMITATION at the top of this file. Attach an alias and a certificate
  # and the deployment gets:
  #
  #   * a registrable domain it controls, so cookie scoping and the CSRF
  #     double-submit no longer rest on a name shared with every other AWS
  #     account, and RS-2 can be satisfied with AllowInsecureCookieMode "false";
  #   * the __Host- prefix and a Path-scoped refresh cookie that work, because
  #     the stage segment stays on the origin side (see OriginPath below) and
  #     the browser sees paths rooted at "/";
  #   * TLS terminated at the edge, closer to the viewer than the region is.
  #
  # Without an alias it is the same distribution on a *.cloudfront.net name,
  # which is a shared registrable domain exactly as execute-api is — so it buys
  # the edge TLS and nothing about cookies. The parameter descriptions say so;
  # this template will not pretend a distribution alone fixes RS-2.
  #
  # ---- what is deliberately NOT here ---------------------------------------
  #
  # No access logging and no WAF association. Both are real money — logging is
  # an S3 bucket that grows with traffic, and a web ACL is a fixed monthly
  # charge plus per-request — and neither is needed by anything this block
  # delivers. A deployment that wants them adds them knowing what they cost.
  #
  # No second origin and no S3 bucket. The assets are in the binary; adding a
  # bucket would split the UI across two origins, two deployments and two
  # cache-invalidation stories, to serve fourteen files totalling well under a
  # megabyte that the function already has in memory.
  # ---------------------------------------------------------------------

  # The cache policy, and the argument for why it caches nothing.
  #
  # This origin serves four classes of response and not one of them is
  # shared-cacheable:
  #
  #   1. The SSR pages (<ApiPrefix>/ui, /ui/login, …). Every one embeds a
  #      per-request config object, and the core sends
  #      "no-store, no-cache, must-revalidate, max-age=0" on them — which is the
  #      reference's own header (ui.router.ts:284), not an addition.
  #   2. GET <ApiPrefix>/ui/config. It carries "no-store" and it is the request
  #      that distributes a fresh per-client CSRF cookie. A shared cache that
  #      stored one 200 would hand one visitor's CSRF cookie to the next.
  #   3. Every auth route. They set session cookies and return per-user bodies.
  #   4. The static assets. They are sent "public, max-age=0" — express.static's
  #      maxAge: 0, reproduced (ui.router.ts:330) — so a cache may store them but
  #      must revalidate every time, and the embedded files carry neither an
  #      ETag nor a Last-Modified for a revalidation to succeed against. There is
  #      therefore no hit to be had from them even in principle, only a
  #      conditional request that always misses.
  #
  # Caching class 4 anyway would mean overriding a TTL the origin declared,
  # which is the edge disagreeing with the server about the server's own policy.
  # Caching any of 1-3 would be a security bug. So the honest configuration is
  # the one below: min, max and default TTL all zero, which is byte for byte
  # what the AWS-managed CachingDisabled policy is. It is declared here rather
  # than referenced by its managed id so that a reader sees the zeros.
  #
  # WARNING, and the reason this comment is long: the cache key below carries
  # NOTHING that identifies a caller — no cookie, no header, no query string,
  # only CloudFront's own normalised Accept-Encoding. That is sound solely
  # because the three TTLs are zero and nothing is ever stored under it. Raising
  # any of them without also widening the key would serve one signed-in
  # visitor's response to the next. If a later block wants edge caching, it
  # belongs on a SEPARATE ordered cache behaviour scoped to paths that carry no
  # credential, never on this policy.
  AuthCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: CloudFrontEnabled
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-auth-no-store'
        Comment: >-
          Caches nothing: every response from the auth origin either declares
          no-store or carries a credential.
        MinTTL: 0
        MaxTTL: 0
        DefaultTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          # Paired with Compress on the behaviour below, which is what CloudFront
          # requires: the flag normalises the viewer's Accept-Encoding, and
          # compression is the one thing the edge does for these responses. It
          # adds the only component this cache key has, and since the TTLs are
          # zero it stores nothing under it either way.
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # What reaches the origin, which is a different question from what the cache
  # key is and is why this is a second policy rather than more of the first.
  #
  # Everything the viewer sent, minus Host. All of it is load-bearing: the
  # Cookie header carries the session, the access token and the CSRF cookie;
  # Authorization carries a bearer token for clients in bearer mode; Origin and
  # Referer are what the core matches against the redirect allowlist; the query
  # string carries ?lang= on the UI routes and the whole OAuth and OIDC callback
  # vocabulary everywhere else. A forwarding policy that dropped any of them
  # would break a flow that works without CloudFront, which is the one thing a
  # front door must not do.
  #
  # Host is the exception, and it has to be: API Gateway routes on the Host
  # header and rejects a request carrying the viewer's. "allExcept [Host]" is
  # the AWS-managed AllViewerExceptHostHeader policy, spelled out here for the
  # same reason the cache policy is.
  AuthOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Condition: CloudFrontEnabled
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-auth-all-viewer-except-host'
        Comment: >-
          Forwards every viewer header except Host, plus all cookies and all
          query strings, to the auth origin.
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: allExcept
          Headers: [Host]
        QueryStringsConfig:
          QueryStringBehavior: all

  AuthDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CloudFrontEnabled
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'awesome-lambda-auth front door for ${AWS::StackName} — hosted UI and API, same origin, uncached'
        PriceClass: !Ref CloudFrontPriceClass
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If [HasCloudFrontAliases, !Split [',', !Ref CloudFrontAliases], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasCloudFrontCertificate
          - AcmCertificateArn: !Ref CloudFrontCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: HttpApiOrigin
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            # The stage segment lives here and not in the browser's URL. A named
            # stage serves the API under /<stage>/…; putting that on the origin
            # means the function sees exactly the path it sees without
            # CloudFront — which is what AWESOME_AUTH_DEPLOYMENT_STAGE tells
            # lambdahttp to strip — while the viewer sees paths rooted at "/",
            # which is what the __Host- cookie prefix and the Path-scoped
            # refresh cookie require. A $default stage has no segment to move.
            OriginPath: !If [IsDefaultStage, !Ref 'AWS::NoValue', !Sub '/${StageName}']
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              # Longer than the function can possibly take: API Gateway caps the
              # integration at 29s and the Timeout parameter is bounded by it,
              # so the edge never gives up on a request the origin is still
              # answering and turns a slow login into a 504 nothing logged.
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: HttpApiOrigin
          # The whole surface is one behaviour on purpose. There is no path
          # under this origin that may be cached (see AuthCachePolicy), so a
          # second behaviour could only differ in ways that are wrong.
          ViewerProtocolPolicy: redirect-to-https
          # CloudFront accepts exactly three sets here and this is the widest of
          # them, spelled in its canonical order. It has to be: the auth surface
          # is POST, PATCH and DELETE as much as it is GET, and a narrower set
          # answers 403 at the edge for a request the origin would have served.
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          # Compression is the one thing the edge does for these responses that
          # the origin does not: the function sends no Content-Encoding, and the
          # HTML pages and the vendored CSS and JS compress well.
          Compress: true
          CachePolicyId: !Ref AuthCachePolicy
          OriginRequestPolicyId: !Ref AuthOriginRequestPolicy

  # =====================================================================
  # Observability
  # =====================================================================
  #
  # Nine alarms, one optional topic to send them to, one optional budget and one
  # optional anomaly monitor. Each alarm below states the incident it catches and
  # why its threshold is that number, because an alarm whose threshold nobody can
  # justify is an alarm somebody eventually silences.
  #
  # None of them has an OKActions, deliberately. "The alarm cleared" is not news
  # — the console and the alarm history both have it — and doubling the volume of
  # mail is the reliable way to get alarms filtered into a folder nobody reads.
  #
  # All of them treat missing data as not breaching. A stack with no traffic
  # publishes no Lambda and no DynamoDB metrics at all, and an alarm that went
  # off because nothing happened would be an alarm turned off within the week.

  # The notification target, created only when AlarmEmail is set.
  #
  # NOT ENCRYPTED, and that is a decision rather than an omission: an SNS topic
  # encrypted with the AWS-managed aws/sns key cannot be published to by
  # CloudWatch, Budgets or Cost Anomaly Detection, because those services cannot
  # be granted use of an AWS-managed key. The result is the worst possible
  # failure — a stack that deploys, a topic that looks right, and alarms that
  # silently reach nobody. A customer-managed key with a policy for all three
  # service principals would work and costs USD 1.00/month; what travels through
  # here is an alarm name and a metric value, so it is not worth the dollar or
  # the extra failure mode.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: CreateAlarmTopic
    Properties:
      TopicName: !Sub '${AWS::StackName}-alarms'
      DisplayName: !Sub '${AWS::StackName} alarms'
      Subscription:
        # SNS sends a confirmation mail to this address and the subscription
        # stays *pending* until somebody clicks it. An unconfirmed subscription
        # is indistinguishable from a working one in the stack's output, so
        # confirm it and then trip an alarm on purpose once.
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # A TopicPolicy REPLACES the topic's access policy; it does not add to it. The
  # first statement is therefore the default policy AWS would have written,
  # reproduced — without it, deploying this would take the account's own ability
  # to publish, subscribe or manage the topic away.
  #
  # The other three are the service principals that need explicit permission.
  # CloudWatch would in fact be covered by the default SourceOwner condition;
  # it is spelled out anyway so that the list of what may publish here is the
  # list a reader can see. Each is scoped by aws:SourceAccount, which is the
  # confused-deputy guard: without it the statement authorises *any* account's
  # budget to publish into this topic.
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: CreateAlarmTopic
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OwnerFullControl
            Effect: Allow
            Principal: {AWS: !Ref 'AWS::AccountId'}
            Action:
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:Publish
            Resource: !Ref AlarmTopic
          - Sid: CloudWatchAlarms
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
          - Sid: Budgets
            Effect: Allow
            Principal: {Service: budgets.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
          - Sid: CostAnomalyDetection
            Effect: Allow
            Principal: {Service: costalerts.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}

  # ── the function ────────────────────────────────────────────────────
  #
  # Errors, Throttles, Duration, ConcurrentExecutions. This quartet is the
  # per-function set, and **a later block that adds a function adds its own four**
  # — the SSE function above all, which is the one this whole section was
  # sequenced before. Four alarm metrics per function at USD 0.10 each past the
  # free ten; a five-function stack is around USD 1.00/month in alarms, which is
  # the right price for knowing.

  # Invocations that FAILED, which is a different and much narrower thing than
  # requests that answered 4xx or 5xx: the auth router returns those through the
  # adapter as successful invocations. A datapoint here means the handler itself
  # did not answer — a refuse-to-start rule tripping at init (every request 500s
  # until it is fixed), a panic, an event shape the adapter could not decode.
  #
  # The threshold is 1 because the steady-state value is 0. There is no "a few
  # errors are normal" regime for this metric in this stack, so a percentage
  # would only delay the message.
  AuthErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub '${AWS::StackName}-auth-errors'
      AlarmDescription: >-
        The auth function failed an invocation. Not a 4xx or a 5xx the router
        returned — those are successful invocations — but the handler itself not
        answering: a refuse-to-start rule, a panic, an undecodable event.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref AuthFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTarget
        - [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
        - !Ref 'AWS::NoValue'

  # Invocations Lambda refused. Two causes, and both want knowing about:
  # ReservedConcurrentExecutions if one is set — the hard cap doing its job, and
  # therefore real users being refused — or the account's unreserved pool being
  # exhausted, which is every other function in the region being refused too.
  #
  # Threshold 1, for the same reason as Errors: the normal value is zero.
  AuthThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub '${AWS::StackName}-auth-throttles'
      AlarmDescription: >-
        Lambda refused an invocation of the auth function — the reservation
        binding, or the account's concurrency pool exhausted. Either way, someone
        got a 429 they did not deserve.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - {Name: FunctionName, Value: !Ref AuthFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTarget
        - [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
        - !Ref 'AWS::NoValue'

  # Duration approaching the timeout, which is a COST alarm as much as a latency
  # one: Lambda bills GB-milliseconds, so a function that has started timing out
  # bills its entire configured timeout on every request instead of the ~1 ms of
  # a /healthz or the ~300 ms of a login. At the default 10 s that is a thirtyfold
  # bill increase per request, arriving with no change in traffic.
  #
  # Maximum and not Average: one invocation sitting on a dead downstream is
  # invisible in an average over a busy period, and it is the one that is about to
  # become all of them. Two consecutive periods, because a single slow request —
  # a cold start behind a slow Secrets Manager, one retried SES call — is not an
  # incident, and an alarm that fires on those gets muted.
  AuthDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub '${AWS::StackName}-auth-duration'
      AlarmDescription: >-
        The auth function's slowest invocation is approaching its timeout, twice
        running. A function that times out bills its whole timeout on every
        request; this fires before that, not after.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - {Name: FunctionName, Value: !Ref AuthFunction}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref DurationAlarmThresholdMs
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTarget
        - [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
        - !Ref 'AWS::NoValue'

  # Simultaneous execution environments. This is the alarm for the two incidents
  # the plan for this stack is actually afraid of, and it catches them HOURS
  # before any spend signal does — CloudWatch billing metrics update roughly every
  # six hours and Cost Explorer is a day behind, while this is a minute behind:
  #
  #   * an SSE connection (or any long poll) that never closes. Each one holds an
  #     execution environment for its whole life and bills GB-seconds the entire
  #     time, while every dashboard shows a healthy function answering quickly.
  #     Concurrency is the only metric that moves.
  #   * a recursive invocation. Lambda's own recursion detection covers
  #     Lambda→SQS/SNS→Lambda loops, not a function that re-enters through HTTP,
  #     and this stack's next blocks add exactly those transports.
  #
  # Sustained for five minutes at one-minute resolution, so a burst of parallel
  # logins does not page anybody; a spin loop holds the number up and a crowd
  # does not.
  AuthConcurrencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub '${AWS::StackName}-auth-concurrency'
      AlarmDescription: >-
        The auth function has held this many simultaneous execution environments
        for five minutes. The first and fastest signal of a connection that never
        closes or an invocation that re-enters itself — both of which bill
        GB-seconds while looking perfectly healthy.
      Namespace: AWS/Lambda
      MetricName: ConcurrentExecutions
      Dimensions:
        - {Name: FunctionName, Value: !Ref AuthFunction}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: !Ref ConcurrencyAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTarget
        - [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
        - !Ref 'AWS::NoValue'

  # ── the table ───────────────────────────────────────────────────────
  #
  # Throttles and consumed capacity, read and write kept apart in both pairs. The
  # split is not symmetry for its own sake: which side moves is most of the
  # diagnosis. Writes are registrations, sessions and — above all — the rate
  # limiter's own counter; reads are logins, session checks and the hosted UI.

  # The write ceiling binding. MaxWriteRequestUnits is 200, so this fires when
  # the deliberate cap in this template is doing its job and refusing writes: a
  # credential-stuffing run has become a DynamoDB bill, and the limiter is
  # failing open because its counter lives in the same table (ratelimit.go).
  AuthTableWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub '${AWS::StackName}-table-write-throttles'
      AlarmDescription: >-
        DynamoDB refused a write against the auth table — MaxWriteRequestUnits
        binding. Registrations, session writes and every rate-limiter counter are
        being dropped, and the limiter fails open when its own counter cannot be
        written.
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - {Name: TableName, Value: !Ref AuthTable}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTarget
        - [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
        - !Ref 'AWS::NoValue'

  # The read ceiling binding. Logins, session lookups and — once the hosted UI is
  # on — two reads per rendered page. A read throttle is a login that fails for a
  # reason the user cannot act on.
  AuthTableReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub '${AWS::StackName}-table-read-throttles'
      AlarmDescription: >-
        DynamoDB refused a read against the auth table — MaxReadRequestUnits
        binding. Logins and session checks are failing for a reason no caller can
        do anything about.
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
        - {Name: TableName, Value: !Ref AuthTable}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTarget
        - [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
        - !Ref 'AWS::NoValue'

  # Consumed capacity, which is the same incident caught a step earlier and is
  # why both pairs exist. A throttle alarm says the ceiling is binding; this says
  # the ceiling is being approached, while there is still room to decide whether
  # to raise it or to stop what is causing it. It is also the one alarm that maps
  # directly onto money: 1.25 USD per million writes, 0.25 per million reads.
  AuthTableWriteCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub '${AWS::StackName}-table-write-capacity'
      AlarmDescription: >-
        Consumed write capacity on the auth table is approaching the
        MaxWriteRequestUnits ceiling. The rate limiter spends 1 WCU per limited
        request whether it allows or refuses it, so sustained write capacity at
        this level is a credential-attempt rate, not a user base.
      Namespace: AWS/DynamoDB
      MetricName: ConsumedWriteCapacityUnits
      Dimensions:
        - {Name: TableName, Value: !Ref AuthTable}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref CapacityAlarmUnits
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTarget
        - [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
        - !Ref 'AWS::NoValue'

  AuthTableReadCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub '${AWS::StackName}-table-read-capacity'
      AlarmDescription: >-
        Consumed read capacity on the auth table is approaching the
        MaxReadRequestUnits ceiling. With sessions.checkOn "allcalls" every
        authenticated request is a strongly-consistent read, so this is the alarm
        that moves first when that knob is turned up — and it is also where a
        polling event stream will show up.
      Namespace: AWS/DynamoDB
      MetricName: ConsumedReadCapacityUnits
      Dimensions:
        - {Name: TableName, Value: !Ref AuthTable}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref CapacityAlarmUnits
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTarget
        - [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
        - !Ref 'AWS::NoValue'

  # ── the logs ────────────────────────────────────────────────────────
  #
  # The bill retention cannot touch. RetentionInDays bounds what is STORED, at
  # ~0.03 USD per GB-month; nothing bounds what is INGESTED, at ~0.50 USD per GB,
  # and ingestion is charged once whether the line is read or not. A loop that
  # logs per iteration therefore spends money at the rate it spins, and the log
  # group is usually where that incident is visible first — a function looping
  # inside one invocation does not even move the Invocations metric.
  #
  # Deliberately hourly rather than five-minutely: this is a bleed, not a spike,
  # and an hour of data is what distinguishes the two.
  AuthLogIngestionAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub '${AWS::StackName}-auth-log-ingestion'
      AlarmDescription: >-
        The auth log group is ingesting far more than this deployment's traffic
        can explain. Log ingestion is billed per GB on the way in, so a loop that
        logs per iteration spends money at the rate it spins — and retention,
        which bounds storage only, does nothing about it.
      Namespace: AWS/Logs
      MetricName: IncomingBytes
      Dimensions:
        - {Name: LogGroupName, Value: !Ref AuthLogGroup}
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref LogIngestionAlarmBytes
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTarget
        - [!If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]]
        - !Ref 'AWS::NoValue'

  # =====================================================================
  # The budget, and why it is not a second zero-spend budget
  # =====================================================================
  #
  # THE DECISION: add one, off by default, and make it blind to credits.
  #
  # The argument, because "add a budget" is otherwise indistinguishable from
  # duplicating something the account already has.
  #
  # 1. **A budget is an alert, not a cap.** AWS does not stop services when one
  #    trips; it sends a notification. If credit runs out and spend continues,
  #    the charge falls to the payment method on file whatever any budget says.
  #    Nothing in AWS caps spend. The only caps in this stack are
  #    ReservedConcurrentExecutions and the two DynamoDB request-unit ceilings.
  #
  # 2. **The zero-spend budget an account already has cannot fire while credit is
  #    covering the bill.** AWS's own "My Zero-Spend Budget" template alerts above
  #    USD 0.01 of *actual* cost, and actual cost is computed with credits
  #    included — a credit applied to a charge is a negative line that nets it to
  #    zero. So a deployment burning USD 40 a month against a promotional grant
  #    shows USD 0.00 to that budget and it stays silent for the entire period in
  #    which the money is being spent. It fires the month the credit runs out,
  #    which is the month it is no longer useful.
  #
  # 3. **This one sets IncludeCredit: false**, so it measures gross consumption —
  #    which is both a different number from the console budget's and the exact
  #    number a "stop when cumulative consumption approaches N" rule is written
  #    against. That is why it is not a duplicate: two budgets on the same account
  #    measuring the same thing would be noise; these two measure different things
  #    and the second one is the one that can speak.
  #
  # 4. **No public API reports a promotional credit balance.** It cannot be read,
  #    only inferred — consumption comes from Cost Explorer and the remaining
  #    credit is the grant minus that. This budget is an alert on the half that
  #    can be measured, and .tools/credit.sh does the same arithmetic by hand.
  #    docs/cost-model.md §6 states the method.
  #
  # 5. **Cost, and why "two" matters.** The first two budgets per account are
  #    free; past that it is about USD 0.02 per budget per day. An account with
  #    the AWS zero-spend budget is at one, so this is the free second — and a
  #    third, added later without noticing, is ~USD 0.60/month for the privilege.
  #
  # Scope is the whole account and not this stack. Scoping a budget to a stack
  # needs cost allocation tags activated in the billing console, which
  # CloudFormation cannot do and which only start collecting data from the day
  # they are switched on. Account-wide is also the honest scope for the question
  # being asked, which is "how much of the grant is gone", not "how much did this
  # one stack cost".
  AuthBudget:
    Type: AWS::Budgets::Budget
    Condition: BudgetEnabled
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-gross-consumption'
        BudgetType: COST
        TimeUnit: !Ref BudgetTimeUnit
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
        CostTypes:
          # The two that make this budget different from the console's. Credits
          # excluded means the number tracks what was consumed, not what was
          # charged; refunds excluded means a refund cannot make consumption
          # appear to go down.
          IncludeCredit: false
          IncludeRefund: false
          # Everything else is left as AWS's defaults, spelled out rather than
          # omitted so a reader can see that nothing else was quietly changed.
          IncludeDiscount: true
          IncludeOtherSubscription: true
          IncludeRecurring: true
          IncludeSubscription: true
          IncludeSupport: true
          IncludeTax: true
          IncludeUpfront: true
          UseAmortized: false
          UseBlended: false
      # Three notifications, and the forecast one is the only one that arrives in
      # time to do anything about. AWS needs roughly five weeks of history before
      # it will forecast at all, so a new account gets the two actual thresholds
      # and starts getting the third later.
      NotificationsWithSubscribers: !If
        - BudgetNotifies
        - - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 80
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: SNS
                Address: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: SNS
                Address: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]
          - Notification:
              NotificationType: FORECASTED
              ComparisonOperator: GREATER_THAN
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: SNS
                Address: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]
        - !Ref 'AWS::NoValue'

  # Cost anomaly detection: the spend alarm that needs no threshold agreed in
  # advance, which is the reason it is here alongside a budget rather than
  # instead of one. A budget answers "have we passed a number we chose"; this
  # answers "is this month shaped like the last ones", and the incident this
  # stack is exposed to — steady USD 0.75 a month becoming USD 40 in a week — is
  # a shape long before it is a number.
  #
  # It is also the ONLY spend signal available to a CloudFormation stack at all.
  # A CloudWatch alarm on AWS/Billing EstimatedCharges is not an option here:
  # billing metrics are published in us-east-1 only, and a CloudWatch alarm can
  # only watch metrics in its own region — so a eu-west-1 stack cannot create
  # one, and a template that appeared to would create an alarm on a metric that
  # never reports. Budgets and Cost Explorer are global services and are
  # reachable from any region, which is why both of these resources can live
  # here.
  #
  # THE ONE CAVEAT, stated because this block is validated by reading and never
  # by a deploy: Cost Explorer's own API endpoint is us-east-1. CloudFormation
  # resolves that for a global service and these are documented as ordinary
  # resource types with no region constraint, but if a changeset ever rejects
  # them, the fix is a small companion stack in us-east-1 and not a redesign —
  # which is also why this is the one thing in the section that defaults to off.
  CostAnomalyMonitor:
    Type: AWS::CE::AnomalyMonitor
    Condition: CostAnomalyDetectionEnabled
    Properties:
      MonitorName: !Sub '${AWS::StackName}-by-service'
      # DIMENSIONAL over SERVICE: anomalies are attributed to the service that
      # caused them, so the notification says "Lambda" or "CloudWatch Logs"
      # rather than "your account". Given how few services this stack uses, that
      # is most of the triage done before anybody opens the console.
      MonitorType: DIMENSIONAL
      MonitorDimension: SERVICE

  CostAnomalySubscription:
    Type: AWS::CE::AnomalySubscription
    Condition: CostAnomalyDetectionEnabled
    Properties:
      SubscriptionName: !Sub '${AWS::StackName}-anomalies'
      MonitorArnList: [!Ref CostAnomalyMonitor]
      # IMMEDIATE is not a preference: an SNS subscriber requires it. DAILY and
      # WEEKLY are available to email subscribers only, and this stack notifies
      # through a topic so that one address is configured in one place.
      Frequency: IMMEDIATE
      Subscribers:
        - Type: SNS
          Address: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]
      # An absolute impact of USD 5, not a percentage. Against a baseline under a
      # dollar a month, a percentage threshold fires on rounding — 0.75 becoming
      # 1.50 is +100% and is also nothing. Five dollars of anomalous spend in a
      # day is more than half a year of this stack's steady state, which is the
      # scale at which somebody should be told.
      ThresholdExpression: '{"Dimensions":{"Key":"ANOMALY_TOTAL_IMPACT_ABSOLUTE","MatchOptions":["GREATER_THAN_OR_EQUAL"],"Values":["5"]}}'

Outputs:

  ApiEndpoint:
    Description: Base URL of the auth service. Routes live under <endpoint><ApiPrefix>.
    Value: !If
      - IsDefaultStage
      - !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
      - !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  # The distribution's own hostname, reported rather than wired.
  #
  # It cannot be fed back into the function's environment as
  # AWESOME_AUTH_DEPLOYMENT_PUBLIC_URL, for exactly the reason the raw
  # execute-api URL cannot: AuthFunction.Environment -> AuthDistribution ->
  # HttpApi -> AuthFunction is the same circular dependency, one resource
  # longer. An output is resolved after every resource exists, so this is where
  # the value can be seen; setting PublicUrl to it (or to an alias) on the next
  # deployment is a deliberate second step, and it is the step that turns off
  # the stage-prefixed cookie path and lets RS-2 pass.
  CloudFrontDomainName:
    Condition: CloudFrontEnabled
    Description: >-
      Distribution hostname. Serves the whole stack — hosted UI under
      <ApiPrefix>/ui and the auth routes under <ApiPrefix> — with no stage
      segment in the path and nothing cached. On its own *.cloudfront.net name
      this is a shared registrable domain and does not satisfy RS-2; set
      CloudFrontAliases and CloudFrontCertificateArn for one that does.
    Value: !Sub 'https://${AuthDistribution.DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDomainName'

  TableName:
    Description: DynamoDB single table backing every store.
    Value: !Ref AuthTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  # Where alarms actually go, whichever way it was configured — so that a second
  # stack, a chat bridge or a runbook can subscribe to the same topic instead of
  # growing a second one, and so that "which topic is this deployment using" is
  # answerable without reading the parameters. Absent when neither parameter is
  # set, which is also the deployment where every alarm is decoration.
  AlarmNotificationTopic:
    Condition: HasAlarmTarget
    Description: >-
      SNS topic every alarm, budget notification and cost anomaly publishes to.
      If this stack created it, the email subscription on it is PENDING until the
      confirmation mail is clicked — until then the topic delivers to nobody.
    Value: !If [CreateAlarmTopic, !Ref AlarmTopic, !Ref AlarmTopicArn]
    Export:
      Name: !Sub '${AWS::StackName}-AlarmNotificationTopic'

  FunctionName:
    Description: Lambda function running the auth router.
    Value: !Ref AuthFunction
    Export:
      Name: !Sub '${AWS::StackName}-FunctionName'

  # The console's front door and, when it exists, the bucket behind its upload
  # tab. The URL is the API's own; behind the distribution the same path is
  # served under the CloudFront hostname, with the stage segment gone -- and
  # the stage segment is the whole problem for the console: the shell injects
  # base "/admin" and loads /admin/assets/admin.js root-absolute, exactly as
  # the reference's shell uses req.baseUrl, so on a named stage the browser
  # asks for paths the API does not serve. The KNOWN LIMITATION at the top of
  # this file names the cookie half; this is the other half, and the
  # Description says so.
  AdminConsoleUrl:
    Condition: AdminConsoleEnabled
    Description: >-
      Where the admin console answers. GET here serves the login shell; the
      API beneath it is under /admin/api and answers 401 to anyone the access
      policy has not admitted. Run `migrate backfill-users` once before
      relying on the user tab. On a named stage without CloudFront this URL
      serves the shell but the shell is unusable: it links its assets and
      its API root-absolute (/admin/assets/…, /admin/api/…) without the
      stage segment, so the browser's follow-up requests never reach the
      function. Use the $default stage, the distribution, or a custom domain
      mapping.
    Value: !If
      - IsDefaultStage
      - !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/admin'
      - !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/admin'
    Export:
      Name: !Sub '${AWS::StackName}-AdminConsoleUrl'

  AdminUploadsBucketName:
    Condition: AdminUploadsEnabled
    Description: >-
      The private bucket the console's uploads live in, under the uploads/
      prefix. Nothing in it is public; the function serves the objects under
      <ApiPrefix>/ui/assets/uploads. Empty it before tearing the stack down.
    Value: !Ref AdminUploadsBucket
    Export:
      Name: !Sub '${AWS::StackName}-AdminUploadsBucketName'

  # The two URLs a relying party is configured with. They are outputs rather
  # than something to assemble by hand because getting either wrong is a
  # deployment that looks healthy and verifies nothing: a discovery document
  # served at one issuer and advertised under another is exactly the failure
  # nobody notices until the first client tries.
  #
  # The sentinel value is deliberate. With neither IdpIssuer nor PublicUrl the
  # function derives no issuer at all, says so at cold start, and mints tokens
  # with no iss claim — so an output that guessed the execute-api URL here would
  # be the one place in this stack that lies about what is deployed.

  IssuerUrl:
    Condition: IdpEnabled
    Description: >-
      OIDC issuer this deployment advertises. Discovery lives at
      <IssuerUrl>/.well-known/openid-configuration.
    Value: !If
      - HasIdpIssuer
      - !Ref IdpIssuer
      - !If
        - HasPublicUrl
        - !Sub '${PublicUrl}${ApiPrefix}'
        - '(none: the function derived no issuer — set IdpIssuer, or PublicUrl, and redeploy)'
    Export:
      Name: !Sub '${AWS::StackName}-IssuerUrl'

  JwksUrl:
    Condition: IdpEnabled
    Description: >-
      JWKS endpoint a resource server verifies this deployment's tokens against.
      The path is IdpJwksPath, defaulting to /.well-known/jwks.json; a jwksPath
      moved in ConfigFile instead of here is not visible to CloudFormation, and
      then the discovery document's jwks_uri is the authority.
    Value: !Sub
      - '${Base}${Path}'
      - Base: !If
          - HasIdpIssuer
          - !Ref IdpIssuer
          - !If
            - HasPublicUrl
            - !Sub '${PublicUrl}${ApiPrefix}'
            - '(none: the function derived no issuer — set IdpIssuer, or PublicUrl, and redeploy)'
        Path: !If [HasIdpJwksPath, !Ref IdpJwksPath, '/.well-known/jwks.json']
    Export:
      Name: !Sub '${AWS::StackName}-JwksUrl'

name: go

# The same gate scripts/toolchain.sh runs locally, on a hosted runner:
# formatting, vet, build, race tests against a DynamoDB Local service
# container, then the reproducible Lambda zip with a size budget. The
# contract suite self-skips here because AWESOME_AUTH_CONTRACT_BASE_URL is
# unset; it runs against a deployed stack, not in this workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: gofmt / vet / build / test
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race, DynamoDB Local reachable)
        run: go test -race -count=1 -timeout 30m ./...

  artifact:
    name: lambda zip within budget
    runs-on: ubuntu-latest
    # One zip per function the template deploys. Each name is a cmd/<name>
    # binary and a dist/<name>-lambda.zip CodeUri; a block that adds a
    # function adds its name here, marked with the block id in this comment
    # (a comment cannot sit inside the folded scalar). Job-level, so the build
    # and the size check read one list and a function cannot be built and not
    # checked.
    #   D9b: webhook-worker
    env:
      LAMBDAS: >-
        auth
        webhook-worker
    steps:
      - uses: actions/checkout@v5

      - name: build the Lambda zips in the pinned toolchain image
        run: ./scripts/build-lambda.sh

      - name: enforce the artifact size budget
        run: |
          for name in $LAMBDAS; do
            ./scripts/check-artifact-size.sh "dist/${name}-arm64.zip" "${ARTIFACT_BUDGET_BYTES:-12582912}"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: lambda-artifacts
          path: dist/*.zip
          if-no-files-found: error
